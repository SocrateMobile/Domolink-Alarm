# Services for Domolink Alarm
bypass_sensor:
  name: Ignorer un capteur (Bypass)
  description: Ignore temporairement un capteur de l'alarme (s'il est ouvert ou non joignable).
  fields:
    entity_id:
      name: Entité du capteur
      description: ID de l'entité du capteur à ignorer.
      required: true
      example: binary_sensor.porte_entree
      selector:
        entity: {}

unbypass_sensor:
  name: Rétablir un capteur
  description: Réintègre un capteur précédemment ignoré dans la surveillance de l'alarme.
  fields:
    entity_id:
      name: Entité du capteur
      description: ID de l'entité du capteur à réintégrer.
      required: true
      example: binary_sensor.porte_entree
      selector:
        entity: {}

panic:
  name: Déclencher l'alerte Panique SOS
  description: Déclenche immédiatement l'alerte SOS d'urgence avec notifications et sirènes optionnelles.
  fields:
    activate_sirens:
      name: Activer les sirènes
      description: Activer immédiatement les sirènes sonores.
      required: false
      default: true
      selector:
        boolean: {}

start_presence_simulation:
  name: Démarrer la simulation de présence
  description: Démarre manuellement le rejeu d'historique des lumières et prises.

stop_presence_simulation:
  name: Arrêter la simulation de présence
  description: Arrête manuellement la simulation de présence.

toggle_presence_simulation:
  name: Basculer la simulation de présence
  description: Active ou désactive la simulation de présence.

update_settings:
  name: Mettre à jour les paramètres
  description: Met à jour les options de la configuration de l'alarme à la volée.
  fields:
    chime_mode:
      name: Mode Carillon (Chime)
      description: Activer ou désactiver le carillon.
      required: false
      selector:
        boolean: {}
    presence_simulation_history_days:
      name: Jours historique simulation
      description: Nombre de jours en arrière pour la simulation de présence.
      required: false
      selector:
        number:
          min: 7
          max: 42
          step: 7
    cross_zoning:
      name: Double Détection (Cross-Zoning)
      description: Activer le cross-zoning pour éviter les fausses alertes mouvements.
      required: false
      selector:
        boolean: {}
    entry_delay:
      name: Délai d'entrée
      description: Délai d'entrée en secondes.
      required: false
      selector:
        number:
          min: 0
          max: 300
    exit_delay:
      name: Délai de sortie
      description: Délai de sortie en secondes.
      required: false
      selector:
        number:
          min: 0
          max: 300
    siren_duration:
      name: Durée de sirène
      description: Durée de sonnerie en secondes.
      required: false
      selector:
        number:
          min: 10
          max: 1800
    ftp_protocol:
      name: Protocole FTP
      description: Protocole de transfert (ftp, ftps, sftp, samba).
      required: false
      selector:
        select:
          options:
            - label: FTP (Standard)
              value: ftp
            - label: FTPS (SSL/TLS explicite)
              value: ftps
            - label: SFTP (SSH File Transfer)
              value: sftp
            - label: SAMBA (Partage Windows/SMB)
              value: samba

test_cameras_recording:
  name: Tester l'enregistrement des caméras
  description: Déclenche un test séquentiel de capture photo et d'enregistrement vidéo de 30 secondes sur toutes les caméras l'une après l'autre.

media_action:
  name: Action sur fichier média
  description: Supprime ou renomme un fichier photo ou vidéo dans le dossier média Domolink.
  fields:
    action:
      name: Action
      description: Type d'action à effectuer (delete ou rename).
      required: true
      selector:
        select:
          options:
            - label: Supprimer
              value: delete
            - label: Renommer
              value: rename
    filename:
      name: Nom du fichier
      description: Nom du fichier média ciblé.
      required: true
      selector:
        text: {}
    new_name:
      name: Nouveau nom
      description: Nouveau nom de fichier avec extension (uniquement si action rename).
      required: false
      selector:
        text: {}

test_ftp:
  name: Tester la connexion FTP
  description: Force un test complet de connexion au serveur FTP avec diagnostic détaillé, vérification de l'arborescence domolink/alarm et test des droits d'écriture.
  fields:
    nas_type:
      name: Type de NAS
      description: Identifiant du profil NAS testé (ex: asustor, synology, qnap, truenas, freebox, unraid, generic).
      required: false
      selector:
        text: {}
    ftp_protocol:
      name: Protocole
      description: Protocole de transfert (ftp, ftps, sftp, samba).
      required: false
      selector:
        select:
          options:
            - label: FTP (Standard)
              value: ftp
            - label: FTPS (SSL/TLS explicite)
              value: ftps
            - label: SFTP (SSH File Transfer)
              value: sftp
            - label: SAMBA (Partage Windows/SMB)
              value: samba
    ftp_host:
      name: Hôte FTP
      description: Adresse IP ou nom d'hôte du serveur FTP.
      required: false
      selector:
        text: {}
    ftp_port:
      name: Port FTP
      description: Port TCP du serveur FTP.
      required: false
      selector:
        number:
          min: 1
          max: 65535
    ftp_user:
      name: Utilisateur FTP
      description: Nom d'utilisateur pour l'authentification.
      required: false
      selector:
        text: {}
    ftp_pass:
      name: Mot de passe FTP
      description: Mot de passe FTP.
      required: false
      selector:
        text: {}
    ftp_path:
      name: Dossier distant
      description: Répertoire racine ou sous-dossier distant.
      required: false
      selector:
        text: {}

test_webdav:
  name: Tester la connexion WebDAV
  description: Force un test complet de connexion au serveur Cloud WebDAV / Nextcloud avec diagnostic étape par étape, création de dossier et test d'écriture/suppression.
  fields:
    nas_type:
      name: Type de NAS
      description: Identifiant du profil NAS testé (ex: asustor, synology, qnap, truenas, freebox, unraid, generic).
      required: false
      selector:
        text: {}
    webdav_url:
      name: URL WebDAV
      description: URL complète du serveur WebDAV ou Nextcloud.
      required: false
      selector:
        text: {}
    webdav_user:
      name: Utilisateur WebDAV
      description: Nom d'utilisateur WebDAV.
      required: false
      selector:
        text: {}
    webdav_pass:
      name: Mot de passe WebDAV
      description: Mot de passe ou token WebDAV.
      required: false
      selector:
        text: {}
    webdav_path:
      name: Dossier distant
      description: Chemin distant relatif.
      required: false
      selector:
        text: {}

clean_media:
  name: Nettoyer le stockage des médias
  description: Déclenche manuellement la purge des médias selon la durée de rétention en jours et le quota d'espace alloué en Mo.

test_google_drive:
  name: Tester la connexion Google Drive
  description: Force un test complet de diagnostic de synchronisation avec Google Drive (Webhook ou API OAuth2) avec vérification des droits d'écriture.

add_user_profile:
  name: Ajouter / Mettre à jour un Profil Utilisateur
  description: Crée ou modifie un code PIN avec plages horaires, jours d'accès et options de validité temporaire.
  fields:
    name:
      name: Nom de l'utilisateur
      description: Prénom ou nom du profil (ex: Ménage, Voisins).
      required: true
      selector:
        text: {}
    code:
      name: Code PIN
      description: Code PIN à 4 ou 6 chiffres.
      required: true
      selector:
        text: {}
    role:
      name: Rôle
      description: Type de profil (user, guest, cleaner, babysitter).
      required: false
      default: guest
      selector:
        select:
          options:
            - user
            - guest
            - cleaner
            - babysitter
    allowed_days:
      name: Jours autorisés
      description: Jours de la semaine autorisés (mon,tue,wed,thu,fri,sat,sun).
      required: false
      selector:
        text: {}
    allowed_time_start:
      name: Heure de début
      description: Heure de début au format HH:MM (ex: 08:00).
      required: false
      selector:
        text: {}
    allowed_time_end:
      name: Heure de fin
      description: Heure de fin au format HH:MM (ex: 18:00).
      required: false
      selector:
        text: {}
    valid_until:
      name: Date d'expiration
      description: Date de fin de validité au format AAAA-MM-JJ (ex: 2026-12-31).
      required: false
      selector:
        text: {}
    single_use:
      name: Code à usage unique
      description: Invalide le code après le premier désarmement réussi.
      required: false
      default: false
      selector:
        boolean: {}

delete_user_profile:
  name: Supprimer un Profil Utilisateur
  description: Supprime un profil utilisateur ou code PIN temporaire.
  fields:
    name:
      name: Nom de l'utilisateur
      description: Nom du profil à supprimer.
      required: true
      selector:
        text: {}

snooze_reminder:
  name: Reporter le rappel d'armement (Snooze)
  description: Repousse le rappel d'oubli d'armement de 15 minutes.
  fields:
    minutes:
      name: Durée du report (minutes)
      description: Nombre de minutes avant le prochain rappel.
      required: false
      default: 15
      selector:
        number:
          min: 5
          max: 120

sync_physical_keypad:
  name: Synchroniser les Claviers Physiques
  description: Émet manuellement les commandes de synchronisation d'état et bips vers les claviers Zigbee / Z-Wave.

generate_incident_report:
  name: Générer les données du Rapport d'Incident
  description: Prépare et certifie les données de l'incident le plus récent pour l'export PDF officiel.


