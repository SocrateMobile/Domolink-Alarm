# Services for Domolink Alarm
bypass_sensor:
  name: Ignorer un capteur (Bypass)
  description: Ignore temporairement un capteur de l'alarme (s'il est ouvert ou non joignable).
  fields:
    entity_id:
      name: Entité du capteur
      description: ID de l'entité du capteur à ignorer.
      required: true
      example: binary_sensor.porte_entree
      selector:
        entity:

unbypass_sensor:
  name: Rétablir un capteur
  description: Réintègre un capteur précédemment ignoré dans la surveillance de l'alarme.
  fields:
    entity_id:
      name: Entité du capteur
      description: ID de l'entité du capteur à réintégrer.
      required: true
      example: binary_sensor.porte_entree
      selector:
        entity:

panic:
  name: Déclencher l'alerte Panique SOS
  description: Déclenche immédiatement l'alerte SOS d'urgence avec notifications et sirènes optionnelles.
  fields:
    activate_sirens:
      name: Activer les sirènes
      description: Activer immédiatement les sirènes sonores.
      required: false
      default: true
      selector:
        boolean:

start_presence_simulation:
  name: Démarrer la simulation de présence
  description: Démarre manuellement le rejeu d'historique des lumières et prises.

stop_presence_simulation:
  name: Arrêter la simulation de présence
  description: Arrête manuellement la simulation de présence.

toggle_presence_simulation:
  name: Basculer la simulation de présence
  description: Active ou désactive la simulation de présence.

update_settings:
  name: Mettre à jour les paramètres
  description: Met à jour les options de la configuration de l'alarme à la volée.
  fields:
    chime_mode:
      name: Mode Carillon (Chime)
      description: Activer ou désactiver le carillon.
      required: false
      selector:
        boolean:
    presence_simulation_history_days:
      name: Jours historique simulation
      description: Nombre de jours en arrière pour la simulation de présence.
      required: false
      selector:
        number:
          min: 7
          max: 42
          step: 7
    cross_zoning:
      name: Double Détection (Cross-Zoning)
      description: Activer le cross-zoning pour éviter les fausses alertes mouvements.
      required: false
      selector:
        boolean:
    entry_delay:
      name: Délai d'entrée
      description: Délai d'entrée en secondes.
      required: false
      selector:
        number:
          min: 0
          max: 300
    exit_delay:
      name: Délai de sortie
      description: Délai de sortie en secondes.
      required: false
      selector:
        number:
          min: 0
          max: 300
    siren_duration:
      name: Durée de sirène
      description: Durée de sonnerie en secondes.
      required: false
      selector:
        number:
          min: 10
          max: 1800
