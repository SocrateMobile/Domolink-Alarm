      if (id(display_page) == 1) return std::string("Tado (Page 1)");
      if (id(display_page) == 2) return std::string("Trains (Page 2)");
      if (id(display_page) == 3) return std::string("Arrosage (Page 3)");
      if (id(display_page) == 4) return std::string("Alarme (Page 4)");
