# =============================================================================
#  DOMOLINK ALARM — Firmware ESPHome pour Sunton ESP32-S3 7.0" (800x480)
# =============================================================================
#  Matériel : Sunton ESP32-8048S070  (ESP32-S3, 16MB Flash, Octal PSRAM)
#  Écran    : MIPI RGB 800x480, GT911 tactile capacitif
#  Auteur   : SocrateMobile / Domolink
#  Version  : 1.0.0
# =============================================================================

substitutions:
  devicename: "domolink-alarm"
  friendly_name: "Domolink Alarm Écran 7 Pouces"
  project_name: "Domolink.Alarm-Screen"
  project_version: "1.0.0"

esphome:
  name: ${devicename}
  min_version: 2024.11.0
  project:
    name: ${project_name}
    version: ${project_version}
  build_flags:
    - "-DBOARD_HAS_PSRAM"
  on_boot:
    priority: 600
    then:
      - light.turn_on: display_backlight

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESP_DEFAULT_CPU_FREQ_MHZ_240: y
      CONFIG_ESP32S3_DATA_CACHE_64KB: y
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: y
      CONFIG_SPIRAM_RODATA: y
      CONFIG_ESP_MAIN_TASK_STACK_SIZE: "32768"
      CONFIG_FREERTOS_HZ: "1000"
      CONFIG_ESP_CONSOLE_USB_SERIAL_JTAG: n

api:
  encryption:
    key: "vR4VDfiJLMzj0Gv4SbULJ5YuZCdBIJRPS8v4/PN0sRA="
  services:
    # Service appelable depuis HA pour déclencher une alarme locale (buzzer futur)
    - service: trigger_screen_alert
      then:
        - lambda: |-
            id(screen_alert_active) = true;

captive_portal:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: false

logger:
  hardware_uart: UART0
  baud_rate: 0
  level: INFO

ota:
  - platform: esphome
    encryption:

psram:
  mode: octal
  speed: 80MHz

# =============================================================================
#  VARIABLES GLOBALES
# =============================================================================
globals:
  # --- État du boot ---
  - id: boot_done
    type: bool
    initial_value: 'false'

  # --- Navigation par pages ---
  - id: display_page
    type: int
    restore_value: false
    initial_value: '0'

  # --- Code PIN saisi (max 8 chiffres) ---
  - id: pin_buffer
    type: std::string
    restore_value: false
    initial_value: '""'

  # --- Nombre de chiffres saisis ---
  - id: pin_length
    type: int
    initial_value: '0'

  # --- Compteur d'inactivité du clavier (secondes) ---
  - id: pin_idle_counter
    type: int
    initial_value: '0'

  # --- Message d'état temporaire (CODE OK, INCORRECT, etc.) ---
  - id: keypad_message
    type: std::string
    restore_value: false
    initial_value: '""'

  # --- Compteur pour effacer le message temporaire ---
  - id: msg_display_counter
    type: int
    initial_value: '0'

  # --- Mode d'armement en attente (0=désarmer, 1=absent, 2=nuit) ---
  - id: pending_arm_mode
    type: int
    initial_value: '0'

  # --- Alerte écran active ---
  - id: screen_alert_active
    type: bool
    initial_value: 'false'

  # --- Compteur clignotement alerte ---
  - id: alert_blink_counter
    type: int
    initial_value: '0'

  # --- Niveau de luminosité (0=25%, 1=50%, 2=75%, 3=100%) ---
  - id: brightness_level
    type: int
    restore_value: true
    initial_value: '3'

  # --- Confirmation SOS active ---
  - id: sos_confirm_active
    type: bool
    initial_value: 'false'

  # --- Compteur timeout SOS (secondes) ---
  - id: sos_confirm_counter
    type: int
    initial_value: '0'

# =============================================================================
#  INTERVALLES / TIMERS
# =============================================================================
interval:
  # Vérification boot rapide (500ms)
  - interval: 500ms
    then:
      - lambda: |-
          if (!id(boot_done)) {
            bool api_ok  = api_is_connected();
            bool time_ok = id(ha_time).now().is_valid();
            if (api_ok && time_ok) {
              id(boot_done) = true;
              id(display_page) = 0;
            }
            id(my_display).update();
          }

  # Tick principal chaque seconde
  - interval: 1s
    then:
      - lambda: |-
          if (!id(boot_done)) return;

          // --- Timeout clavier PIN (15s d'inactivité) ---
          if (id(pin_length) > 0) {
            id(pin_idle_counter)++;
            if (id(pin_idle_counter) >= 15) {
              id(pin_buffer) = "";
              id(pin_length) = 0;
              id(pin_idle_counter) = 0;
              id(pending_arm_mode) = 0;
            }
          }

          // --- Effacement message temporaire après 3s ---
          if (!id(keypad_message).empty()) {
            id(msg_display_counter)++;
            if (id(msg_display_counter) >= 3) {
              id(keypad_message) = "";
              id(msg_display_counter) = 0;
            }
          }

          // --- Clignotement alerte ---
          if (id(screen_alert_active)) {
            id(alert_blink_counter)++;
          }

          // --- Timeout confirmation SOS (10s) ---
          if (id(sos_confirm_active)) {
            id(sos_confirm_counter)++;
            if (id(sos_confirm_counter) >= 10) {
              id(sos_confirm_active) = false;
              id(sos_confirm_counter) = 0;
            }
          }

          id(my_display).update();

# =============================================================================
#  BUS I2C & ÉCRAN TACTILE GT911
# =============================================================================
i2c:
  - id: bus_a
    sda: 19
    scl: 20
    frequency: 400kHz
    scan: true

touchscreen:
  platform: gt911
  id: my_touchscreen
  i2c_id: bus_a
  address: 0x5D
  transform:
    swap_xy: false
    mirror_x: false
    mirror_y: false
  on_touch:
    - lambda: |-
        if (!id(boot_done)) return;
        static uint32_t last_touch_ms = 0;
        uint32_t now_ms = millis();
        if (now_ms - last_touch_ms < 300) return;
        last_touch_ms = now_ms;

        int x = touch.x;
        int y = touch.y;

        // =============================================================
        // BARRE DE NAVIGATION INFÉRIEURE (y >= 420)
        // =============================================================
        if (y >= 420) {
          int next_page = id(display_page);
          if (x < 267) next_page = 0;
          else if (x < 534) next_page = 1;
          else next_page = 2;
          if (next_page != id(display_page)) {
            id(display_page) = next_page;
            // Réinitialiser SOS si on quitte la page
            if (next_page != 2) {
              id(sos_confirm_active) = false;
              id(sos_confirm_counter) = 0;
            }
            id(my_display).update();
          }
          return;
        }

        // =============================================================
        // PAGE 0 : ALARME & CLAVIER
        // =============================================================
        if (id(display_page) == 0) {

          // --- CLAVIER NUMÉRIQUE (partie droite x:480-790, y:80-380) ---
          if (x >= 480 && x <= 790 && y >= 115 && y <= 415) {

            // Grille 3 colonnes x 4 lignes
            // Colonnes : 480-580, 585-685, 690-790
            // Lignes   : 115-185, 190-255, 260-325, 330-400
            int col = -1, row = -1;
            if (x >= 480 && x < 583) col = 0;
            else if (x >= 583 && x < 687) col = 1;
            else if (x >= 687 && x <= 790) col = 2;

            if (y >= 115 && y < 190) row = 0;
            else if (y >= 190 && y < 260) row = 1;
            else if (y >= 260 && y < 330) row = 2;
            else if (y >= 330 && y <= 415) row = 3;

            if (col >= 0 && row >= 0) {
              id(pin_idle_counter) = 0;  // Reset du timeout

              // Mapping : 1-9 puis C, 0, Valider
              if (row < 3) {
                // Chiffres 1-9
                int digit = row * 3 + col + 1;
                if (id(pin_length) < 8) {
                  id(pin_buffer) += std::to_string(digit);
                  id(pin_length)++;
                }
              } else {
                // Dernière ligne
                if (col == 0) {
                  // C = Effacer tout
                  id(pin_buffer) = "";
                  id(pin_length) = 0;
                  id(pending_arm_mode) = 0;
                  id(keypad_message) = "";
                  id(msg_display_counter) = 0;
                } else if (col == 1) {
                  // 0
                  if (id(pin_length) < 8) {
                    id(pin_buffer) += "0";
                    id(pin_length)++;
                  }
                } else if (col == 2) {
                  // Valider (coche)
                  if (id(pin_length) >= 4) {
                    std::string code = id(pin_buffer);
                    int mode = id(pending_arm_mode);

                    if (mode == 1) {
                      // Armement Absent
                      id(ha_arm_away_svc).execute(code);
                      id(keypad_message) = "ARMEMENT ABSENT...";
                    } else if (mode == 2) {
                      // Armement Nuit
                      id(ha_arm_night_svc).execute(code);
                      id(keypad_message) = "ARMEMENT NUIT...";
                    } else {
                      // Désarmement (mode == 0)
                      id(ha_disarm_svc).execute(code);
                      id(keypad_message) = "DESARMEMENT...";
                    }

                    id(msg_display_counter) = 0;
                    id(pin_buffer) = "";
                    id(pin_length) = 0;
                    id(pending_arm_mode) = 0;
                    id(pin_idle_counter) = 0;
                  } else {
                    id(keypad_message) = "CODE TROP COURT";
                    id(msg_display_counter) = 0;
                  }
                }
              }
              id(my_display).update();
            }
            return;
          }

          // --- BOUTONS DE MODE (partie gauche, y: 350-400) ---
          // Bouton "Absent" : x 20-155, y 350-395
          if (x >= 20 && x <= 155 && y >= 350 && y <= 395) {
            id(pending_arm_mode) = 1;
            id(keypad_message) = "SAISIR CODE ABSENT";
            id(msg_display_counter) = 0;
            id(pin_idle_counter) = 0;
            id(my_display).update();
            return;
          }
          // Bouton "Nuit" : x 165-300, y 350-395
          if (x >= 165 && x <= 300 && y >= 350 && y <= 395) {
            id(pending_arm_mode) = 2;
            id(keypad_message) = "SAISIR CODE NUIT";
            id(msg_display_counter) = 0;
            id(pin_idle_counter) = 0;
            id(my_display).update();
            return;
          }
          // Bouton "Désarmer" : x 310-460, y 350-395
          if (x >= 310 && x <= 460 && y >= 350 && y <= 395) {
            id(pending_arm_mode) = 0;
            id(keypad_message) = "SAISIR CODE";
            id(msg_display_counter) = 0;
            id(pin_idle_counter) = 0;
            id(my_display).update();
            return;
          }
        }

        // =============================================================
        // PAGE 2 : SYSTÈME / SOS
        // =============================================================
        if (id(display_page) == 2) {

          // --- Bouton SOS PANIQUE (x:100-700, y:60-140) ---
          if (x >= 100 && x <= 700 && y >= 60 && y <= 140) {
            if (!id(sos_confirm_active)) {
              // Premier appui : demander confirmation
              id(sos_confirm_active) = true;
              id(sos_confirm_counter) = 0;
            } else {
              // Deuxième appui : confirmer et envoyer
              id(ha_sos_svc).execute();
              id(sos_confirm_active) = false;
              id(sos_confirm_counter) = 0;
              id(keypad_message) = "SOS ENVOYE !";
              id(msg_display_counter) = 0;
            }
            id(my_display).update();
            return;
          }

          // --- Boutons luminosité (y: 200-260) ---
          // 25% : x 50-200
          if (x >= 50 && x <= 200 && y >= 200 && y <= 260) {
            id(brightness_level) = 0;
            auto call = id(display_backlight).turn_on();
            call.set_brightness(0.25);
            call.perform();
            id(my_display).update();
            return;
          }
          // 50% : x 210-360
          if (x >= 210 && x <= 360 && y >= 200 && y <= 260) {
            id(brightness_level) = 1;
            auto call = id(display_backlight).turn_on();
            call.set_brightness(0.50);
            call.perform();
            id(my_display).update();
            return;
          }
          // 75% : x 370-520
          if (x >= 370 && x <= 520 && y >= 200 && y <= 260) {
            id(brightness_level) = 2;
            auto call = id(display_backlight).turn_on();
            call.set_brightness(0.75);
            call.perform();
            id(my_display).update();
            return;
          }
          // 100% : x 530-700
          if (x >= 530 && x <= 700 && y >= 200 && y <= 260) {
            id(brightness_level) = 3;
            auto call = id(display_backlight).turn_on();
            call.set_brightness(1.0);
            call.perform();
            id(my_display).update();
            return;
          }

          // --- Bouton Redémarrer (x:250-550, y:320-380) ---
          if (x >= 250 && x <= 550 && y >= 320 && y <= 380) {
            // Redémarrage de l'ESP
            App.safe_reboot();
            return;
          }
        }

