        auto draw_train_card = [&](int cx, int cy, int cw, int ch,
                                   const char* title, const char* subtitle,
                                   const std::string& raw_time, int minutes,
                                   const std::string& track, const std::string& status,
                                   const std::string& mission, bool is_night) {
          // 1. Fond arrondi de la tuile
          draw_rrect(cx, cy, cw, ch, 14, COLOR_PANEL_BG);

          // 2. Trait d'accentuation couleur
          Color accent_col = is_night ? COLOR_ORANGE : (cx < 400 ? COLOR_CYAN : COLOR_BLUE);
          draw_rrect(cx + 14, cy + 12, 4, 22, 2, accent_col);

          // 3. Titre de la destination
          it.printf(cx + 26, cy + 23, id(font_20), COLOR_WHITE, TextAlign::CENTER_LEFT, "%s", title);

          // 4. Badge Voie en haut à droite
          std::string trk_txt = (track.empty() || track == "unavailable" || track == "unknown") ? "-" : track;
          char track_buf[24];
          if (trk_txt.find("Voie") != std::string::npos || trk_txt.find("VOIE") != std::string::npos) {
            snprintf(track_buf, sizeof(track_buf), "%s", trk_txt.c_str());
          } else {
            snprintf(track_buf, sizeof(track_buf), "VOIE %s", trk_txt.c_str());
          }
          draw_rrect(cx + cw - 95, cy + 11, 80, 24, 6, COLOR_MID_GRAY);
          it.printf(cx + cw - 55, cy + 23, id(font_16), accent_col, TextAlign::CENTER, "%s", track_buf);

          // 5. Sous-titre / Ligne & Mission
          char sub_buf[64];
          std::string msn = (mission.empty() || mission == "unavailable" || mission == "unknown" || mission == "TRAIN" || mission == "-") ? "" : mission;
          if (!msn.empty()) {
            snprintf(sub_buf, sizeof(sub_buf), "%s • %s", subtitle, msn.c_str());
          } else {
            snprintf(sub_buf, sizeof(sub_buf), "%s", subtitle);
          }
          it.printf(cx + 26, cy + 47, id(font_16), COLOR_DARK_GRAY, TextAlign::CENTER_LEFT, "%s", sub_buf);

          // 6. Ligne séparatrice fine
          it.line(cx + 14, cy + 62, cx + cw - 14, cy + 62, COLOR_CARD_BORDER);

          // 7. Grande heure de départ
          std::string t_str = format_time_str(raw_time);
          it.printf(cx + 22, cy + 98, id(font_32), is_night ? COLOR_ORANGE : COLOR_WHITE, TextAlign::CENTER_LEFT, "%s", t_str.c_str());

          // 8. Badge Compte à rebours
          char cd_str[32] = "-- min";
          Color cd_bg = COLOR_MID_GRAY;
          Color cd_fg = COLOR_LIGHT_GRAY;

          if (minutes != -999 && t_str != "--:--") {
            if (minutes < 0) {
              snprintf(cd_str, sizeof(cd_str), "Parti");
              cd_bg = COLOR_MID_GRAY;
              cd_fg = COLOR_DARK_GRAY;
            } else if (minutes <= 1) {
              snprintf(cd_str, sizeof(cd_str), "A QUAI");
              cd_bg = COLOR_RED_DIM;
              cd_fg = COLOR_RED;
            } else if (minutes <= 3) {
              snprintf(cd_str, sizeof(cd_str), "IMMINENT");
              cd_bg = COLOR_RED_DIM;
              cd_fg = COLOR_RED;
            } else if (minutes <= 7) {
              snprintf(cd_str, sizeof(cd_str), "%d min", minutes);
              cd_bg = COLOR_ORANGE_DIM;
              cd_fg = COLOR_ORANGE;
            } else if (minutes < 60) {
              snprintf(cd_str, sizeof(cd_str), "%d min", minutes);
              cd_bg = is_night ? COLOR_ORANGE_DIM : COLOR_GREEN_DIM;
              cd_fg = is_night ? COLOR_ORANGE : COLOR_GREEN;
            } else {
              int h = minutes / 60;
              int m = minutes % 60;
              snprintf(cd_str, sizeof(cd_str), "%dh%02d", h, m);
              cd_bg = is_night ? COLOR_ORANGE_DIM : COLOR_MID_GRAY;
              cd_fg = is_night ? COLOR_ORANGE : COLOR_CYAN;
            }
          } else {
            snprintf(cd_str, sizeof(cd_str), "Attente");
          }

          draw_rrect(cx + cw - 124, cy + 82, 110, 32, 16, cd_bg);
          it.printf(cx + cw - 69, cy + 98, id(font_16), cd_fg, TextAlign::CENTER, "%s", cd_str);

          // 9. Statut ponctualité & information
          std::string st_txt = (status.empty() || status == "unavailable" || status == "unknown") ? "Trafic normal" : status;
          Color st_col = COLOR_LIGHT_GRAY;
          if (st_txt.find("Retard") != std::string::npos || st_txt.find("retard") != std::string::npos) {
            st_col = COLOR_RED;
          } else if (st_txt.find("heure") != std::string::npos || st_txt.find("Heure") != std::string::npos) {
            st_col = COLOR_GREEN;
          } else if (is_night) {
            st_col = COLOR_ORANGE;
          }

          it.filled_circle(cx + 24, cy + 143, 4, st_col);
          it.printf(cx + 34, cy + 143, id(font_16), st_col, TextAlign::CENTER_LEFT, "%s", st_txt.c_str());
        };

        // Données capteurs Train 1 Paris
        bool has_p1 = id(ha_train_p1_min).has_state() && !std::isnan(id(ha_train_p1_min).state);
        int min_p1 = has_p1 ? (int)id(ha_train_p1_min).state : -999;
        draw_train_card(40, 58, 346, 168,
                        "PARIS NORD (1er)", "Ligne H • Enghien -> Paris",
                        id(ha_train_p1_time).state, min_p1,
                        id(ha_train_p1_track).state, id(ha_train_p1_status).state,
                        id(ha_train_p1_mission).state, false);

        // Données capteurs Train 2 Paris
        bool has_p2 = id(ha_train_p2_min).has_state() && !std::isnan(id(ha_train_p2_min).state);
        int min_p2 = has_p2 ? (int)id(ha_train_p2_min).state : -999;
        draw_train_card(414, 58, 346, 168,
                        "PARIS NORD (2e)", "Ligne H • Enghien -> Paris",
                        id(ha_train_p2_time).state, min_p2,
                        id(ha_train_p2_track).state, id(ha_train_p2_status).state,
                        id(ha_train_p2_mission).state, false);

        // Données capteurs Train Ermont - Eaubonne
        bool has_ea = id(ha_train_ea_min).has_state() && !std::isnan(id(ha_train_ea_min).state);
        int min_ea = has_ea ? (int)id(ha_train_ea_min).state : -999;
        draw_train_card(40, 242, 346, 168,
                        "ERMONT - EAUBONNE", "Ligne H • Enghien -> Ermont",
                        id(ha_train_ea_time).state, min_ea,
                        id(ha_train_ea_track).state, id(ha_train_ea_status).state,
                        id(ha_train_ea_mission).state, false);

        // Données capteurs Dernier Retour Paris (Nocturne 00h-02h)
        bool has_ret = id(ha_train_ret_min).has_state() && !std::isnan(id(ha_train_ret_min).state);
        int min_ret = has_ret ? (int)id(ha_train_ret_min).state : -999;
        std::string ret_stat = id(ha_train_ret_status).state;
        if (ret_stat.empty() || ret_stat == "unavailable" || ret_stat == "unknown" || ret_stat == "Trafic normal") {
          ret_stat = "Nocturne (00h - 02h)";
        }
        draw_train_card(414, 242, 346, 168,
                        "DERNIER RETOUR PARIS", "Paris Nord -> Enghien (Nuit)",
                        id(ha_train_ret_time).state, min_ret,
                        id(ha_train_ret_track).state, ret_stat,
                        id(ha_train_ret_mission).state, true);
      }

      // =============================================================
      // PAGE 3 : ARROSAGE AUTOMATIQUE (5 ZONES & CYCLES)
      // =============================================================
      if (current_p == 5) {
        // --- 1. LIGNE SUPÉRIEURE : 4 CARTES SYNTHÈSE CAPTEURS (y: 52 à 120) ---
        // A. Pluie
        bool is_rain = id(ha_arr_pluie).has_state() && id(ha_arr_pluie).state;
        draw_rrect(24, 52, 180, 68, 12, COLOR_PANEL_BG);
        draw_rrect(36, 62, 4, 20, 2, is_rain ? COLOR_BLUE : COLOR_GREEN);
        it.printf(46, 72, id(font_16), COLOR_WHITE, TextAlign::CENTER_LEFT, "PLUIE");
        it.printf(114, 98, id(font_20), is_rain ? COLOR_BLUE : COLOR_GREEN, TextAlign::CENTER, is_rain ? "PLUIE" : "SEC");

        // B. Sol Avant
        draw_rrect(214, 52, 180, 68, 12, COLOR_PANEL_BG);
        draw_rrect(226, 62, 4, 20, 2, COLOR_CYAN);
        it.printf(236, 72, id(font_16), COLOR_WHITE, TextAlign::CENTER_LEFT, "SOL AVANT");
        float sol_av = id(ha_arr_sol_av).state;
        char sol_av_buf[24] = "-- %";
        if (!std::isnan(sol_av)) snprintf(sol_av_buf, sizeof(sol_av_buf), "%.0f %%", sol_av);
        it.printf(304, 98, id(font_20), COLOR_CYAN, TextAlign::CENTER, "%s", sol_av_buf);

        // C. Sol Arrière
        draw_rrect(404, 52, 180, 68, 12, COLOR_PANEL_BG);
        draw_rrect(416, 62, 4, 20, 2, COLOR_CYAN);
        it.printf(426, 72, id(font_16), COLOR_WHITE, TextAlign::CENTER_LEFT, "SOL ARRIERE");
        float sol_ar = id(ha_arr_sol_ar).state;
        char sol_ar_buf[24] = "-- %";
        if (!std::isnan(sol_ar)) snprintf(sol_ar_buf, sizeof(sol_ar_buf), "%.0f %%", sol_ar);
        it.printf(494, 98, id(font_20), COLOR_CYAN, TextAlign::CENTER, "%s", sol_ar_buf);

        // D. Statut Système
        bool is_arr_act = id(ha_arrosage_active).has_state() && id(ha_arrosage_active).state;
        draw_rrect(594, 52, 182, 68, 12, COLOR_PANEL_BG);
        draw_rrect(606, 62, 4, 20, 2, is_arr_act ? COLOR_GREEN : COLOR_LIGHT_GRAY);
        it.printf(616, 72, id(font_16), COLOR_WHITE, TextAlign::CENTER_LEFT, "SYSTEME");
        it.printf(685, 98, id(font_20), is_arr_act ? COLOR_GREEN : COLOR_LIGHT_GRAY, TextAlign::CENTER, is_arr_act ? "ACTIF" : "VEILLE");

        // --- 2. LIGNE CENTRALE : LES 5 ZONES D'ARROSAGE (y: 130 à 290) ---
        struct ZoneData {
          const char* num;
          const char* title;
          bool state;
        };

        ZoneData zones[5] = {
          {"1", "Jardin Droit",  id(ha_arr_z1).has_state() && id(ha_arr_z1).state},
          {"2", "Jardin Gauche", id(ha_arr_z2).has_state() && id(ha_arr_z2).state},
          {"3", "Bordures",      id(ha_arr_z3).has_state() && id(ha_arr_z3).state},
          {"4", "Potager",       id(ha_arr_z4).has_state() && id(ha_arr_z4).state},
          {"5", "Bambous",       id(ha_arr_z5).has_state() && id(ha_arr_z5).state}
        };

        for (int i = 0; i < 5; i++) {
          int zx = 24 + i * 154;
          int zy = 130;
          int zw = 142;
          int zh = 160;

          bool z_on = zones[i].state;
          Color z_col = z_on ? COLOR_GREEN : COLOR_LIGHT_GRAY;
          Color z_dim = z_on ? COLOR_GREEN_DIM : COLOR_PANEL_BG;

          draw_rrect(zx, zy, zw, zh, 12, z_dim);
          draw_rrect(zx + 10, zy + 12, 4, 20, 2, z_on ? COLOR_GREEN : COLOR_DARK_GRAY);
          it.printf(zx + 20, zy + 22, id(font_16), COLOR_WHITE, TextAlign::CENTER_LEFT, "Zone %s", zones[i].num);

          it.printf(zx + zw / 2, zy + 58, id(font_16), is_arr_act && z_on ? COLOR_GREEN : COLOR_WHITE, TextAlign::CENTER, "%s", zones[i].title);

          draw_rrect(zx + 14, zy + 86, zw - 28, 36, 8, z_on ? COLOR_GREEN_DIM : COLOR_MID_GRAY);
          it.printf(zx + zw / 2, zy + 104, id(font_16), z_col, TextAlign::CENTER, z_on ? "EN COURS" : "REPOS");

          it.printf(zx + zw / 2, zy + 140, id(font_16), COLOR_DARK_GRAY, TextAlign::CENTER, "Toucher ON/OFF");
        }

        // --- 3. LIGNE INFÉRIEURE : COMMANDES RAPIDES (y: 304 à 416) ---
        // Bouton 1: Cycle 5 min
        draw_rrect(24, 308, 240, 104, 14, COLOR_PANEL_BG);
        draw_rrect(38, 320, 4, 22, 2, COLOR_CYAN);
        it.printf(48, 331, id(font_20), COLOR_CYAN, TextAlign::CENTER_LEFT, "CYCLE 5 MIN");
        it.printf(144, 368, id(font_16), COLOR_LIGHT_GRAY, TextAlign::CENTER, "Toutes les zones");
        it.printf(144, 394, id(font_16), COLOR_DARK_GRAY, TextAlign::CENTER, "Lancer le cycle");

        // Bouton 2: Cycle 10 min
        draw_rrect(280, 308, 240, 104, 14, COLOR_PANEL_BG);
        draw_rrect(294, 320, 4, 22, 2, COLOR_BLUE);
        it.printf(304, 331, id(font_20), COLOR_BLUE, TextAlign::CENTER_LEFT, "CYCLE 10 MIN");
        it.printf(400, 368, id(font_16), COLOR_LIGHT_GRAY, TextAlign::CENTER, "Toutes les zones");
        it.printf(400, 394, id(font_16), COLOR_DARK_GRAY, TextAlign::CENTER, "Lancer le cycle");

        // Bouton 3: Arrêt d'urgence
        draw_rrect(536, 308, 240, 104, 14, COLOR_RED_DIM);
        draw_rrect(550, 320, 4, 22, 2, COLOR_RED);
        it.printf(560, 331, id(font_20), COLOR_RED, TextAlign::CENTER_LEFT, "ARRET D'URGENCE");
        it.printf(656, 368, id(font_16), COLOR_WHITE, TextAlign::CENTER, "Couper l'arrosage");
        it.printf(656, 394, id(font_16), COLOR_LIGHT_GRAY, TextAlign::CENTER, "Arret immediat");
      }

      // =============================================================
      // PAGE 4 : ALARME (DÉTAILS & CONTRÔLE)
      // =============================================================
      if (current_p == 6) {
        // 1. Badge Central Arrondi
        draw_rrect(40, 60, 720, 80, 40, banner_bg);
        it.printf(400, 92, id(font_32), banner_text, TextAlign::CENTER, "%s", state_title);
        it.printf(400, 122, id(font_16), COLOR_LIGHT_GRAY, TextAlign::CENTER, "%s", state_sub);

        // 2. Tuiles Arrondies (Centrage absolu texte)
        bool open_known = id(ha_openings).has_state();
        bool open_st    = open_known && id(ha_openings).state;
        Color col_open  = !open_known ? COLOR_DARK_GRAY : (open_st ? COLOR_RED : COLOR_GREEN);
        draw_rrect(40, 155, 172, 60, 10, COLOR_PANEL_BG);
        it.printf(126, 175, id(font_16), col_open, TextAlign::CENTER, "OUVERTURES");
        it.printf(126, 195, id(font_16), COLOR_LIGHT_GRAY, TextAlign::CENTER, !open_known ? "Inconnu" : (open_st ? "Ouvert" : "Fermees"));

        bool mot_known = id(ha_motions).has_state();
        bool mot_st    = mot_known && id(ha_motions).state;
        Color col_mot  = !mot_known ? COLOR_DARK_GRAY : (mot_st ? COLOR_RED : COLOR_GREEN);
        draw_rrect(222, 155, 172, 60, 10, COLOR_PANEL_BG);
        it.printf(308, 175, id(font_16), col_mot, TextAlign::CENTER, "MOUVEMENTS");
        it.printf(308, 195, id(font_16), COLOR_LIGHT_GRAY, TextAlign::CENTER, !mot_known ? "Inconnu" : (mot_st ? "Detecte" : "Aucun"));

        draw_rrect(404, 155, 172, 60, 10, COLOR_PANEL_BG);
        it.printf(490, 175, id(font_16), COLOR_CYAN, TextAlign::CENTER, "SECURITE 24/7");
        it.printf(490, 195, id(font_16), COLOR_LIGHT_GRAY, TextAlign::CENTER, "Protege");

        draw_rrect(586, 155, 174, 60, 10, COLOR_PANEL_BG);
        it.printf(673, 175, id(font_16), COLOR_CYAN, TextAlign::CENTER, "OCCUPATION");
        it.printf(673, 195, id(font_16), COLOR_LIGHT_GRAY, TextAlign::CENTER, "Surveillance");

        // 3. Zone Alerte ou Infos
        if (alarm_st == "triggered" || alarm_st == "pending" || id(screen_alert_active)) {
          draw_rrect(40, 225, 720, 50, 10, COLOR_RED_DIM);
          it.printf(400, 240, id(font_20), COLOR_RED, TextAlign::CENTER, "ALERTE DETECTEE");
          std::string last_ev = id(ha_alarm_journal).state;
          if (last_ev.empty() || last_ev == "unavailable") last_ev = "Intrusion";
          it.printf(400, 260, id(font_16), COLOR_WHITE, TextAlign::CENTER, "%s", last_ev.c_str());
        }

        // 4. Boutons Pilules Arrondis (Commandes)
        draw_rrect(40, 280, 230, 55, 27, COLOR_PANEL_BG);
        it.printf(155, 307, id(font_20), COLOR_WHITE, TextAlign::CENTER, "Armement Total");

        draw_rrect(285, 280, 230, 55, 27, COLOR_PANEL_BG);
        it.printf(400, 307, id(font_20), COLOR_WHITE, TextAlign::CENTER, "Partiel (Nuit)");

        draw_rrect(530, 280, 230, 55, 27, COLOR_WHITE);
        it.printf(645, 307, id(font_20), Color(20, 25, 35), TextAlign::CENTER, "Desarmer");

        // 5. Bouton SOS Panique
        Color sos_col = id(sos_confirm_active) ? Color(255, 60, 60) : COLOR_RED;
        draw_rrect(40, 355, 720, 50, 25, sos_col);
        it.printf(400, 380, id(font_20), COLOR_WHITE, TextAlign::CENTER, id(sos_confirm_active) ? "CONFIRMER L'ENVOI DU SOS PANIQUE ?" : "SOS PANIQUE IMMEDIAT");

        if (!id(keypad_message).empty()) {
          it.printf(400, 415, id(font_16), COLOR_ORANGE, TextAlign::CENTER, "%s", id(keypad_message).c_str());
        }
      }

      // =============================================================
      // PAGE 5 : CAPTEURS
      // =============================================================
      if (current_p == 7) {
        it.printf(400, 75, id(font_28), COLOR_CYAN, TextAlign::CENTER, "EQUIPEMENTS & CAPTEURS");
        draw_rrect(40, 105, 720, 290, 15, COLOR_PANEL_BG);

        it.printf(70, 135, id(font_20), COLOR_LIGHT_GRAY, TextAlign::CENTER_LEFT, "Mode actuel :");
        it.printf(320, 135, id(font_20), COLOR_CYAN, TextAlign::CENTER_LEFT, "%s", state_title);

        std::string last_u = id(ha_alarm_last_user).state;
        it.printf(70, 175, id(font_20), COLOR_LIGHT_GRAY, TextAlign::CENTER_LEFT, "Dernier utilisateur :");
        it.printf(320, 175, id(font_20), COLOR_WHITE, TextAlign::CENTER_LEFT, "%s", last_u.c_str());

        std::string j2 = id(ha_alarm_journal).state;
        if (j2.length() > 42) j2 = j2.substr(0, 39) + "...";
        it.printf(70, 215, id(font_20), COLOR_LIGHT_GRAY, TextAlign::CENTER_LEFT, "Journal :");
        it.printf(320, 215, id(font_20), COLOR_WHITE, TextAlign::CENTER_LEFT, "%s", j2.c_str());

        it.printf(70, 255, id(font_20), COLOR_LIGHT_GRAY, TextAlign::CENTER_LEFT, "Version firmware :");
        it.printf(320, 255, id(font_20), COLOR_DARK_GRAY, TextAlign::CENTER_LEFT, "${project_version}");

        if (id(alarm_bypassed)) {
          it.printf(70, 335, id(font_20), COLOR_ORANGE, TextAlign::CENTER_LEFT, "Statut armement :");
          it.printf(320, 335, id(font_20), COLOR_ORANGE, TextAlign::CENTER_LEFT, "Partiel (capteurs isoles)");
        } else {
          char rssi_str[32] = "N/A";
          if (!std::isnan(id(wifi_rssi).state)) snprintf(rssi_str, sizeof(rssi_str), "%.0f dBm", id(wifi_rssi).state);
          it.printf(70, 335, id(font_20), COLOR_LIGHT_GRAY, TextAlign::CENTER_LEFT, "Signal Wi-Fi :");
          it.printf(320, 335, id(font_20), COLOR_GREEN, TextAlign::CENTER_LEFT, "%s", rssi_str);
        }
      }

      // =============================================================
      // PAGE 6 : SYSTÈME & REGLAGES
      // =============================================================
      if (current_p == 8) {
        it.printf(400, 75, id(font_28), COLOR_CYAN, TextAlign::CENTER, "SYSTEME & REGLAGES");
        it.printf(400, 165, id(font_20), COLOR_LIGHT_GRAY, TextAlign::CENTER, "LUMINOSITE DE L'ECRAN");

        const char* bright_labels[] = {"25%", "50%", "75%", "100%"};
        int bright_xs[] = {50, 210, 370, 530};
        for (int i = 0; i < 4; i++) {
          Color bg = (id(brightness_level) == i) ? COLOR_BLUE : COLOR_PANEL_BG;
          draw_rrect(bright_xs[i], 190, 150, 55, 27, bg);
          it.printf(bright_xs[i] + 75, 217, id(font_20), (id(brightness_level) == i) ? COLOR_WHITE : COLOR_CYAN, TextAlign::CENTER, "%s", bright_labels[i]);
        }

        it.printf(400, 290, id(font_16), COLOR_DARK_GRAY, TextAlign::CENTER, "Domolink Alarm v${project_version}");

        Color reboot_bg = id(reboot_confirm_active) ? COLOR_RED : COLOR_PANEL_BG;
        draw_rrect(250, 320, 300, 55, 27, reboot_bg);
        it.printf(400, 347, id(font_20), id(reboot_confirm_active) ? COLOR_WHITE : COLOR_ORANGE, TextAlign::CENTER, id(reboot_confirm_active) ? "CONFIRMER REBOOT ?" : "REDEMARRER");
      }

      // =============================================================
      // BARRE DE NAVIGATION (y: 425-480, 7 ONGLETS DE 114PX)
      // =============================================================
      it.filled_rectangle(0, 425, 800, 55, COLOR_PANEL_BG);
      it.line(0, 425, 800, 425, COLOR_CARD_BORDER);
      it.line(114, 425, 114, 480, COLOR_CARD_BORDER);
      it.line(228, 425, 228, 480, COLOR_CARD_BORDER);
      it.line(342, 425, 342, 480, COLOR_CARD_BORDER);
      it.line(456, 425, 456, 480, COLOR_CARD_BORDER);
      it.line(570, 425, 570, 480, COLOR_CARD_BORDER);
      it.line(684, 425, 684, 480, COLOR_CARD_BORDER);

      // Onglet 0: Maison
      if (current_p == 0) it.filled_rectangle(0, 425, 114, 55, COLOR_MID_GRAY);
      it.printf(57, 452, id(font_16), current_p == 0 ? COLOR_CYAN : COLOR_DARK_GRAY, TextAlign::CENTER, "Maison");

      // Onglet 1: Tado
      if (current_p == 1) it.filled_rectangle(114, 425, 114, 55, COLOR_MID_GRAY);
      it.printf(171, 452, id(font_16), current_p == 1 ? COLOR_CYAN : COLOR_DARK_GRAY, TextAlign::CENTER, "Tado");

      // Onglet 2: Trains
      if (current_p == 2) it.filled_rectangle(228, 425, 114, 55, COLOR_MID_GRAY);
      it.printf(285, 452, id(font_16), current_p == 2 ? COLOR_CYAN : COLOR_DARK_GRAY, TextAlign::CENTER, "Trains");

      // Onglet 3: Arrosage
      if (current_p == 3) it.filled_rectangle(342, 425, 114, 55, COLOR_MID_GRAY);
      it.printf(399, 452, id(font_16), current_p == 3 ? COLOR_CYAN : COLOR_DARK_GRAY, TextAlign::CENTER, "Arrosage");

      // Onglet 4: Alarme
      if (current_p == 4) it.filled_rectangle(456, 425, 114, 55, COLOR_MID_GRAY);
      it.printf(513, 452, id(font_16), current_p == 4 ? COLOR_CYAN : COLOR_DARK_GRAY, TextAlign::CENTER, "Alarme");

      // Onglet 5: Capteurs
      if (current_p == 5) it.filled_rectangle(570, 425, 114, 55, COLOR_MID_GRAY);
      it.printf(627, 452, id(font_16), current_p == 5 ? COLOR_CYAN : COLOR_DARK_GRAY, TextAlign::CENTER, "Capteurs");

      // Onglet 6: Système
      if (current_p == 6) it.filled_rectangle(684, 425, 116, 55, COLOR_MID_GRAY);
      it.printf(742, 452, id(font_16), current_p == 6 ? COLOR_CYAN : COLOR_DARK_GRAY, TextAlign::CENTER, "Système");

      // =============================================================
      // POPIN : CLAVIER PIN ESCAMOTABLE (Z-Index MAX)
      // =============================================================
      if (id(pin_modal_active)) {
        // Ombre portée sombre sans canal alpha blanc opaque
        it.filled_rectangle(0, 0, 800, 480, Color(0, 0, 0, 180));
        draw_rrect(220, 30, 360, 380, 15, COLOR_PANEL_BG);
        it.printf(400, 55, id(font_20), COLOR_WHITE, TextAlign::CENTER, "ENTRER LE PIN");

        draw_rrect(530, 40, 35, 35, 17, COLOR_MID_GRAY);
        it.printf(547, 57, id(font_16), COLOR_WHITE, TextAlign::CENTER, "X");

        int dot_start = 400 - (4 * 16);
        for (int d = 0; d < 8; d++) {
          int dx = dot_start + d * 32;
          if (d < id(pin_length)) it.filled_circle(dx, 85, 7, COLOR_CYAN);
          else it.circle(dx, 85, 7, COLOR_MID_GRAY);
        }

        const int kw = 90;
        const int kh = 55;
        const int kx0 = 245;
        const int ky0 = 110;
        const char* k_labels[4][3] = { {"1","2","3"}, {"4","5","6"}, {"7","8","9"}, {"C","0","OK"} };

        for (int r = 0; r < 4; r++) {
          for (int c = 0; c < 3; c++) {
            int kx = kx0 + c * 105;
            int ky = ky0 + r * 70;

            Color bg_k = COLOR_MID_GRAY; Color tx_k = COLOR_WHITE;
            if (r == 3 && c == 0) { bg_k = COLOR_RED_DIM; tx_k = COLOR_RED; }
            else if (r == 3 && c == 2) { bg_k = COLOR_GREEN_DIM; tx_k = COLOR_GREEN; }

            draw_rrect(kx, ky, kw, kh, 27, bg_k);
            it.printf(kx + kw / 2, ky + kh / 2, id(font_24), tx_k, TextAlign::CENTER, "%s", k_labels[r][c]);
          }
        }
      }

      // =============================================================
      // POPIN : AVERTISSEMENT OUVERTURES (Z-Index MAX 2)
      // =============================================================
      if (id(bypass_warning_active)) {
        it.filled_rectangle(0, 0, 800, 480, Color(0, 0, 0, 180));
        draw_rrect(70, 70, 660, 310, 15, COLOR_PANEL_BG);
        it.printf(400, 110, id(font_28), COLOR_ORANGE, TextAlign::CENTER, "ATTENTION : CAPTEURS");
        it.printf(400, 160, id(font_20), COLOR_WHITE, TextAlign::CENTER, "Souhaitez vous forcer l'activation de l'alarme,");
        it.printf(400, 190, id(font_20), COLOR_WHITE, TextAlign::CENTER, "et isoler les capteurs ?");

        draw_rrect(120, 280, 250, 65, 32, COLOR_MID_GRAY);
        it.printf(245, 312, id(font_24), COLOR_WHITE, TextAlign::CENTER, "Annuler");

        draw_rrect(430, 280, 250, 65, 32, COLOR_ORANGE);
        it.printf(555, 312, id(font_24), COLOR_WHITE, TextAlign::CENTER, "OK");
      }

# =============================================================================
#  PÉRIPHÉRIQUES ET HOME ASSISTANT
# =============================================================================
output:
  - platform: ledc
    id: gpio_backlight_pwm
    pin: GPIO02
    frequency: 1220

light:
  - platform: monochromatic
    output: gpio_backlight_pwm
    name: "${friendly_name} Rétroéclairage"
    icon: mdi:lightbulb-on
    id: display_backlight
    restore_mode: ALWAYS_ON

time:
  - platform: homeassistant
    id: ha_time

sensor:
  - platform: wifi_signal
    name: "${friendly_name} Signal WiFi"
    id: wifi_rssi
    update_interval: 15s
  - platform: uptime
    name: "${friendly_name} Uptime"
    id: uptime_sensor
    update_interval: 60s
  - platform: debug
    free:
      name: "Heap libre"
    loop_time:
      name: "Loop time max"

