      // =============================================================
      // PAGE 1 : CHAUFFAGE DOMOLINK-TADO (GRILLE + MODAL PIÈCE)
      // =============================================================
      if (current_p == 1) {
        struct TadoRoomData {
          const char* name;
          float cur_temp;
          float tgt_temp;
          std::string action;
        };

        TadoRoomData rooms[8] = {
          {"Salon",           id(ha_tado_salon_cur).state,     id(ha_tado_salon_tgt).state,     id(ha_tado_salon_act).state},
          {"Cuisine",         id(ha_tado_cuisine_cur).state,   id(ha_tado_cuisine_tgt).state,   id(ha_tado_cuisine_act).state},
          {"Salle à Manger",  id(ha_tado_sam_cur).state,       id(ha_tado_sam_tgt).state,       id(ha_tado_sam_act).state},
          {"Ch. Stef & JF",   id(ha_tado_ch_stef_cur).state,   id(ha_tado_ch_stef_tgt).state,   id(ha_tado_ch_stef_act).state},
          {"Ch. Blaise",      id(ha_tado_ch_blaise_cur).state, id(ha_tado_ch_blaise_tgt).state, id(ha_tado_ch_blaise_act).state},
          {"Ch. Lia",         id(ha_tado_ch_lia_cur).state,    id(ha_tado_ch_lia_tgt).state,    id(ha_tado_ch_lia_act).state},
          {"Bureau JF",       id(ha_tado_bureau_cur).state,    id(ha_tado_bureau_tgt).state,    id(ha_tado_bureau_act).state},
          {"Salle de Bains",  id(ha_tado_sdb_cur).state,       id(ha_tado_sdb_tgt).state,       id(ha_tado_sdb_act).state}
        };

        // SI LA MODALE DE RÉGLAGE EST ACTIVE :
        if (id(tado_modal_open)) {
          it.filled_rectangle(0, 48, 800, 367, Color(10, 12, 18));

          int mx = 40, my = 52, mw = 720, mh = 358;
          draw_rrect(mx, my, mw, mh, 16, COLOR_PANEL_BG);
          it.rectangle(mx, my, mw, mh, COLOR_CYAN);
          it.rectangle(mx + 1, my + 1, mw - 2, mh - 2, COLOR_CYAN);

          int r_idx = id(tado_selected_room);
          if (r_idx < 0 || r_idx >= 8) r_idx = 0;
          const char* r_name = rooms[r_idx].name;
          float cur_t = rooms[r_idx].cur_temp;
          float tgt_t = rooms[r_idx].tgt_temp;
          bool is_heat = (rooms[r_idx].action == "heating");

          // En-tête de la modale
          draw_rrect(mx + 16, my + 12, 4, 26, 2, is_heat ? COLOR_ORANGE : COLOR_CYAN);
          it.printf(mx + 28, my + 25, id(font_24), COLOR_WHITE, TextAlign::CENTER_LEFT, "%s", r_name);
          it.printf(mx + 200, my + 25, id(font_16), COLOR_LIGHT_GRAY, TextAlign::CENTER_LEFT, "CONTRÔLE THERMIQUE TADO");

          // Bouton FERMER
          draw_rrect(mx + mw - 120, my + 10, 105, 30, 8, COLOR_MID_GRAY);
          it.printf(mx + mw - 68, my + 25, id(font_16), COLOR_WHITE, TextAlign::CENTER, "FERMER X");

          it.line(mx + 16, my + 46, mx + mw - 16, my + 46, COLOR_CARD_BORDER);

          // Ligne 1 : Actuelle vs Consigne (y: 110 à 212)
          draw_rrect(mx + 16, my + 56, 190, 94, 12, COLOR_MID_GRAY);
          it.printf(mx + 28, my + 70, id(font_16), COLOR_LIGHT_GRAY, TextAlign::CENTER_LEFT, "ACTUELLE");
          char cur_str[24] = "--.- °C";
          if (!std::isnan(cur_t) && cur_t > 0.0f) snprintf(cur_str, sizeof(cur_str), "%.1f °C", cur_t);
          it.printf(mx + 28, my + 104, id(font_32), is_heat ? COLOR_ORANGE : COLOR_WHITE, TextAlign::CENTER_LEFT, "%s", cur_str);
          draw_rrect(mx + 28, my + 126, 140, 18, 4, is_heat ? COLOR_ORANGE_DIM : COLOR_PANEL_BG);
          it.printf(mx + 98, my + 135, id(font_16), is_heat ? COLOR_ORANGE : COLOR_DARK_GRAY, TextAlign::CENTER, is_heat ? "CHAUFFE ACTIVE" : "REPOS");

          draw_rrect(mx + 218, my + 56, 486, 94, 12, COLOR_MID_GRAY);

          // Bouton [- 0.5°]
          draw_rrect(mx + 230, my + 66, 84, 74, 10, COLOR_CARD_BORDER);
          it.printf(mx + 272, my + 103, id(font_24), COLOR_CYAN, TextAlign::CENTER, "- 0.5");

          // Consigne cible au centre
          char tgt_str[24] = "--.- °C";
          if (!std::isnan(tgt_t) && tgt_t >= 5.0f) snprintf(tgt_str, sizeof(tgt_str), "%.1f °C", tgt_t);
          else snprintf(tgt_str, sizeof(tgt_str), "OFF");
          it.printf(mx + 461, my + 82, id(font_16), COLOR_LIGHT_GRAY, TextAlign::CENTER, "CONSIGNE CIBLE");
          it.printf(mx + 461, my + 115, id(font_32), COLOR_WHITE, TextAlign::CENTER, "%s", tgt_str);

          // Bouton [+ 0.5°]
          draw_rrect(mx + 608, my + 66, 84, 74, 10, COLOR_CARD_BORDER);
          it.printf(mx + 650, my + 103, id(font_24), COLOR_CYAN, TextAlign::CENTER, "+ 0.5");

          // Barre curseur de température (5°C à 30°C)
          int bar_x = mx + 16, bar_y = my + 158, bar_w = 688;
          draw_rrect(bar_x, bar_y, bar_w, 10, 5, COLOR_CARD_BORDER);
          float pct = 0.0f;
          if (!std::isnan(tgt_t) && tgt_t >= 5.0f) {
            pct = (tgt_t - 5.0f) / 25.0f;
            if (pct < 0.0f) pct = 0.0f;
            if (pct > 1.0f) pct = 1.0f;
          }
          int fill_w = (int)(pct * bar_w);
          if (fill_w > 0) draw_rrect(bar_x, bar_y, fill_w, 10, 5, is_heat ? COLOR_ORANGE : COLOR_CYAN);
          it.filled_circle(bar_x + fill_w, bar_y + 5, 8, COLOR_WHITE);

          // Ligne 2 : 4 Modes rapides (y: my + 178, h: 66)
          // 1. AUTO
          draw_rrect(mx + 16, my + 178, 160, 66, 12, COLOR_MID_GRAY);
          draw_rrect(mx + 24, my + 188, 4, 46, 2, COLOR_CYAN);
          it.printf(mx + 98, my + 201, id(font_20), COLOR_CYAN, TextAlign::CENTER, "AUTO");
          it.printf(mx + 98, my + 226, id(font_16), COLOR_LIGHT_GRAY, TextAlign::CENTER, "Planning");

          // 2. BOOST 25°
          draw_rrect(mx + 192, my + 178, 160, 66, 12, COLOR_ORANGE_DIM);
          draw_rrect(mx + 200, my + 188, 4, 46, 2, COLOR_ORANGE);
          it.printf(mx + 274, my + 201, id(font_20), COLOR_ORANGE, TextAlign::CENTER, "BOOST");
          it.printf(mx + 274, my + 226, id(font_16), COLOR_LIGHT_GRAY, TextAlign::CENTER, "25 °C (30m)");

          // 3. ÉCO 17°
          draw_rrect(mx + 368, my + 178, 160, 66, 12, COLOR_GREEN_DIM);
          draw_rrect(mx + 376, my + 188, 4, 46, 2, COLOR_GREEN);
          it.printf(mx + 450, my + 201, id(font_20), COLOR_GREEN, TextAlign::CENTER, "ÉCO");
          it.printf(mx + 450, my + 226, id(font_16), COLOR_LIGHT_GRAY, TextAlign::CENTER, "17 °C");

          // 4. ÉTEINDRE
          draw_rrect(mx + 544, my + 178, 160, 66, 12, COLOR_RED_DIM);
          draw_rrect(mx + 552, my + 188, 4, 46, 2, COLOR_RED);
          it.printf(mx + 626, my + 201, id(font_20), COLOR_RED, TextAlign::CENTER, "OFF");
          it.printf(mx + 626, my + 226, id(font_16), COLOR_LIGHT_GRAY, TextAlign::CENTER, "Éteindre");

          // Ligne 3 : Presets de consigne directe (y: my + 258, h: 36)
          for (int p_idx = 0; p_idx < 7; p_idx++) {
            int px1 = mx + 16 + p_idx * 99;
            int pw = 88;
            float p_temp = 17.0f + (float)p_idx;
            bool is_curr = (std::abs(tgt_t - p_temp) < 0.25f);
            draw_rrect(px1, my + 258, pw, 36, 8, is_curr ? COLOR_CYAN : COLOR_MID_GRAY);
            char p_buf[16];
            snprintf(p_buf, sizeof(p_buf), "%.0f °C", p_temp);
            it.printf(px1 + pw / 2, my + 276, id(font_16), is_curr ? COLOR_WHITE : COLOR_LIGHT_GRAY, TextAlign::CENTER, "%s", p_buf);
          }
        } else {
          // --- 1. ACTIONS GLOBALES (y: 52 à 104) ---
          const char* tado_actions[] = {"AUTO / PLANNING", "BOOST 25°C", "ÉCO GÉNÉRAL", "TOUT ÉTEINDRE"};
          Color tado_colors[] = {COLOR_CYAN, COLOR_ORANGE, COLOR_GREEN, COLOR_LIGHT_GRAY};
          Color tado_dims[]   = {COLOR_MID_GRAY, COLOR_ORANGE_DIM, COLOR_GREEN_DIM, COLOR_MID_GRAY};
          int act_xs[] = {24, 214, 404, 594};

          for (int i = 0; i < 4; i++) {
            draw_rrect(act_xs[i], 52, 180, 52, 12, tado_dims[i]);
            draw_rrect(act_xs[i] + 10, 52 + 10, 4, 32, 2, tado_colors[i]);
            it.printf(act_xs[i] + 20, 52 + 26, id(font_16), tado_colors[i], TextAlign::CENTER_LEFT, "%s", tado_actions[i]);
          }

          // --- 2. GRILLE DES 8 PIÈCES (y: 110 à 356) ---
          for (int i = 0; i < 8; i++) {
            int row = i / 4;
            int col = i % 4;
            int rx = 24 + col * 190;
            int ry = 112 + row * 122;
            int rw = 180;
            int rh = 114;

            bool is_sel = (id(tado_selected_room) == i);
            draw_rrect(rx, ry, rw, rh, 12, COLOR_PANEL_BG);
            if (is_sel) {
              draw_rrect(rx + 2, ry + 2, rw - 4, rh - 4, 10, COLOR_MID_GRAY);
            }

            // Nom pièce
            it.printf(rx + 12, ry + 16, id(font_16), is_sel ? COLOR_CYAN : COLOR_WHITE, TextAlign::CENTER_LEFT, "%s", rooms[i].name);

            // Badge Chauffage
            bool is_heating = (rooms[i].action == "heating");
            Color badge_c = is_heating ? COLOR_ORANGE : COLOR_DARK_GRAY;
            Color badge_bg = is_heating ? COLOR_ORANGE_DIM : COLOR_PANEL_BG;
            draw_rrect(rx + rw - 70, ry + 8, 62, 20, 6, badge_bg);
            it.printf(rx + rw - 39, ry + 18, id(font_16), badge_c, TextAlign::CENTER, is_heating ? "CHAUFFE" : "REPOS");

            // Température Actuelle
            char t_cur_str[24] = "--.- °C";
            if (!std::isnan(rooms[i].cur_temp) && rooms[i].cur_temp > 0.0f) {
              snprintf(t_cur_str, sizeof(t_cur_str), "%.1f °C", rooms[i].cur_temp);
            }
            it.printf(rx + 12, ry + 56, id(font_24), is_heating ? COLOR_ORANGE : COLOR_WHITE, TextAlign::CENTER_LEFT, "%s", t_cur_str);

            // Température Cible
            char t_tgt_str[24] = "Cible: --°C";
            if (!std::isnan(rooms[i].tgt_temp) && rooms[i].tgt_temp > 0.0f) {
              snprintf(t_tgt_str, sizeof(t_tgt_str), "Cible: %.1f°C", rooms[i].tgt_temp);
            } else {
              snprintf(t_tgt_str, sizeof(t_tgt_str), "Cible: OFF");
            }
            it.printf(rx + 12, ry + 92, id(font_16), COLOR_LIGHT_GRAY, TextAlign::CENTER_LEFT, "%s", t_tgt_str);
          }

          // --- 3. BARRE DE RÉGLAGE RAPIDE (y: 364 à 416) ---
          draw_rrect(24, 364, 752, 52, 12, COLOR_PANEL_BG);
          int sel_i = id(tado_selected_room);
          if (sel_i < 0 || sel_i >= 8) sel_i = 0;
          char sel_info[64];
          float sel_tgt = rooms[sel_i].tgt_temp;
          if (!std::isnan(sel_tgt) && sel_tgt > 0.0f) {
            snprintf(sel_info, sizeof(sel_info), "Pièce : %s (%.1f °C) - Toucher pour menu", rooms[sel_i].name, sel_tgt);
          } else {
            snprintf(sel_info, sizeof(sel_info), "Pièce : %s (OFF) - Toucher pour menu", rooms[sel_i].name);
