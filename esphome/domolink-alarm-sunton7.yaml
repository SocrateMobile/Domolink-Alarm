        }
      }

      // =============================================================
      // PAGE 2 : TRAINS (LIGNE H & RETOUR NOCTURNE)
      // =============================================================
      if (current_p == 4) {
      // =============================================================
      // PAGE 2 : ÉNERGIE (LINKY, JAUGE PUISSANCE, INDEX HP/HC & CONSO)
      // =============================================================
      if (current_p == 2) {
        // --- 1. LIGNE SUPÉRIEURE (y: 52 à 222, h: 170) ---
        // A. Jauge Puissance Linky (x: 24, w: 366)
        {
          int cx = 24, cy = 52, cw = 366, ch = 170;
          draw_rrect(cx, cy, cw, ch, 14, COLOR_PANEL_BG);
          draw_rrect(cx + 14, cy + 12, 4, 22, 2, COLOR_ORANGE);
          it.printf(cx + 26, cy + 23, id(font_20), COLOR_WHITE, TextAlign::CENTER_LEFT, "COMPTEUR LINKY");
          it.line(cx + 14, cy + 46, cx + cw - 14, cy + 46, COLOR_CARD_BORDER);

          float papp = id(ha_linky_papp).state;
          float courant = id(ha_linky_i).state;
          char p_buf[32] = "-- VA";
          Color p_col = COLOR_GREEN;
          if (!std::isnan(papp)) {
            snprintf(p_buf, sizeof(p_buf), "%.0f VA", papp);
            if (papp < 3000.0f) p_col = COLOR_GREEN;
            else if (papp < 6000.0f) p_col = COLOR_ORANGE;
            else p_col = COLOR_RED;
          }
          it.printf(cx + 24, cy + 78, id(font_32), p_col, TextAlign::CENTER_LEFT, "%s", p_buf);

          // Badge statut puissance
          const char* p_status = (papp < 3000.0f) ? "NORMALE" : (papp < 6000.0f ? "ÉLEVÉE" : "PIC CONSO");
          draw_rrect(cx + 225, cy + 66, 125, 26, 6, COLOR_MID_GRAY);
          it.printf(cx + 287, cy + 79, id(font_16), p_col, TextAlign::CENTER, "%s", p_status);

          // Jauge barre dynamique de charge (sur 9 kVA = 9000 VA)
          float pct = (!std::isnan(papp) && papp > 0) ? (papp / 9000.0f) : 0.0f;
          if (pct > 1.0f) pct = 1.0f;
          int bar_w = 326;
          draw_rrect(cx + 20, cy + 110, bar_w, 14, 7, COLOR_MID_GRAY);
          int fill_w = (int)(bar_w * pct);
          if (fill_w > 4) {
            draw_rrect(cx + 20, cy + 110, fill_w, 14, 7, p_col);
          }

          char sub_buf[64];
          snprintf(sub_buf, sizeof(sub_buf), "Intensité : %.1f A  •  Charge : %.0f %% / 9 kVA",
                   std::isnan(courant) ? 0.0f : courant, pct * 100.0f);
          it.printf(cx + 20, cy + 144, id(font_16), COLOR_LIGHT_GRAY, TextAlign::CENTER_LEFT, "%s", sub_buf);
        }

        // B. Index Compteur & HP / HC (x: 410, w: 366)
        {
          int cx = 410, cy = 52, cw = 366, ch = 170;
          draw_rrect(cx, cy, cw, ch, 14, COLOR_PANEL_BG);
