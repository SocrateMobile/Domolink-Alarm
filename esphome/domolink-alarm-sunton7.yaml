# ==========================================================================================
#  DOMOLINK ALARM — Firmware ESPHome pour Sunton ESP32-S3 7.0" (800x480)
# ==========================================================================================
#  Matériel : Sunton ESP32-8048S070  (ESP32-S3, 16MB Flash, Octal PSRAM)
#  Écran    : MIPI RGB 800x480, GT911 tactile capacitif
#  Auteur   : SocrateMobile / Domolink
#  Version  : 2.6.0 (Tuile Heure épurée x2, Énergie Linky, Qualité de l'air, Météo x2)
# ==========================================================================================

substitutions:
  devicename: "domolink-alarm"
  friendly_name: "Domolink Alarm Écran 7 Pouces"
  project_name: "Domolink.Alarm-Screen"
  project_version: "2.6.0"

  # =========================================================================
  #  CONFIGURATION DES ENTITÉS HOME ASSISTANT (Personnalisable selon la ville)
  # =========================================================================
  # --- MÉTÉO (Météo-France ou Open-Meteo) ---
  ha_sensor_meteo_temp: "sensor.enghien_les_bains_temperature"
  ha_sensor_meteo_rain: "sensor.enghien_les_bains_rain_chance"
  ha_sensor_meteo_freeze: "sensor.enghien_les_bains_freeze_chance"
  ha_sensor_meteo_cloud: "sensor.enghien_les_bains_cloud_cover"
  ha_sensor_meteo_condition: "sensor.enghien_les_bains_original_condition"

  # --- ALARME DOMOLINK ---
  ha_alarm_entity: "alarm_control_panel.enghien_les_bains_domolink_alarm"
  ha_alarm_sos: "button.enghien_les_bains_domolink_alarm_sos_panic"
  ha_alarm_journal: "sensor.enghien_les_bains_domolink_alarm_journal_des_evenements"
  ha_alarm_user: "sensor.enghien_les_bains_domolink_alarm_dernier_utilisateur"
  ha_alarm_watch: "sensor.enghien_les_bains_domolink_alarm_statut_montre_connectee"

  # --- TRANSPORTS & TRAINS (Domolink Transport / SNCF) ---
  ha_train_paris_1: "sensor.domolink_transport_enghien_les_bains_domolink_train_enghien_les_bains_paris_nord_1"
  ha_train_paris_2: "sensor.domolink_transport_enghien_les_bains_domolink_train_enghien_les_bains_paris_nord_2"
  ha_train_eaubonne_1: "sensor.domolink_transport_enghien_les_bains_domolink_train_enghien_les_bains_ermont_eaubonne_1"
  ha_train_eaubonne_2: "sensor.domolink_transport_enghien_les_bains_domolink_train_enghien_les_bains_ermont_eaubonne_2"
  ha_train_dernier_retour: "sensor.domolink_transport_enghien_les_bains_domolink_dernier_retour_paris_nord_enghien_les_bains"

  # --- ÉNERGIE (Compteur Linky & Chauffage) ---
  ha_sensor_linky_papp: "sensor.compteur_linky_puissance_apparente"
  ha_sensor_linky_courant: "sensor.compteur_linky_courant"
  ha_sensor_linky_index_hc: "sensor.compteur_linky_consommation_partie_1"
  ha_sensor_linky_index_hp: "sensor.compteur_linky_consommation_partie_2"
  ha_sensor_tado_chauffe_totale: "sensor.enghien_puissance_de_chauffe_totale"
  ha_sensor_portail_puissance: "sensor.interrupteur_wi_fi_sur_rail_din_avec_mesure_2_puissance"

  # --- QUALITÉ DE L'AIR (Intérieur & Extérieur) ---
  ha_sensor_air_pm25_in: "sensor.qualite_de_l_air_entree_pm2_5"
  ha_sensor_air_cov_in: "sensor.qualite_de_l_air_entree_indice_de_cov"
  ha_sensor_air_temp_in: "sensor.qualite_de_l_air_entree_temperature"
  ha_sensor_air_hum_in: "sensor.qualite_de_l_air_entree_humidite"
  ha_sensor_air_co: "sensor.qualite_de_l_air_et_temperature_monoxide_de_carbone"
  ha_sensor_air_couleur: "sensor.qualite_de_l_air_et_temperature_couleur_de_l_air_2"
  ha_sensor_air_aqi_ext: "sensor.open_meteo_95880_qualite_de_l_air_aqi_europe"
  ha_sensor_air_pm25_ext: "sensor.open_meteo_95880_particules_pm2_5"
  ha_sensor_air_atmo_ext: "sensor.enghien_les_bains_atmo_france_qualite_globale_enghien_les_bains"
  ha_sensor_air_pollen_ext: "sensor.enghien_les_bains_atmo_france_qualite_globale_pollen_enghien_les_bains"
  ha_purifier_fan_entity: "fan.air_purifier_entree"
  ha_purifier_filter_entity: "binary_sensor.air_purifier_entree_replace_filter"
esphome:
  name: ${devicename}
  min_version: 2024.11.0
  project:
    name: ${project_name}
    version: ${project_version}
  build_flags:
    - "-DBOARD_HAS_PSRAM"
  on_boot:
    priority: -100
    then:
      - script.execute:
          id: set_brightness
          level: !lambda 'return id(brightness_level);'

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESP_DEFAULT_CPU_FREQ_MHZ_240: y
      CONFIG_ESP32S3_DATA_CACHE_64KB: y
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: y
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: y
      CONFIG_SPIRAM_RODATA: y
      CONFIG_ESP_MAIN_TASK_STACK_SIZE: "32768"
      CONFIG_PTHREAD_TASK_STACK_SIZE_DEFAULT: "8192"
      CONFIG_FREERTOS_HZ: "1000"
      CONFIG_ESP_CONSOLE_USB_SERIAL_JTAG: n

api:
  reboot_timeout: 0s
  encryption:
    key: !secret domolink_alarm__encryption_key
  actions:
    - action: trigger_screen_alert
      then:
        - lambda: |-
            id(screen_alert_active) = true;
            id(alert_blink_counter) = 0;
            id(need_redraw) = true;

captive_portal:

wifi:
  id: my_wifi
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: false
  power_save_mode: none
  ap:
    ssid: "Domolink-Alarm"
    password: !secret server_password

web_server:
  port: 80
  version: 3
  auth:
    type: digest
    username: !secret server_username
    password: !secret server_password

# =============================================================================
#  LOGS (DEBUGGING CRASHS)
# =============================================================================
logger:
  hardware_uart: UART0
  baud_rate: 115200
  level: INFO

debug:
  update_interval: 30s

ota:
  - platform: esphome
    password: !secret ecran_sunton_7__OTA_7_Pouces

psram:
  mode: octal
  speed: 80MHz

# =============================================================================
#  VARIABLES GLOBALES
# =============================================================================
globals:
  - id: boot_done
    type: bool
    initial_value: 'false'

  - id: need_redraw
    type: bool
    initial_value: 'false'

  - id: display_page
    type: int
    restore_value: false
    initial_value: '0'

  # --- ÉTAT ACTION PORTAIL (0: Repos, 1: En ouverture, 2: En fermeture) ---
  - id: gate_action_state
    type: int
    initial_value: '0'

  - id: gate_action_start_ms
    type: uint32_t
    initial_value: '0'

  # --- PIÈCE TADO SÉLECTIONNÉE (0 à 7) ---
  - id: tado_selected_room
    type: int
    restore_value: false
    initial_value: '0'

  # --- POPIN MENU TADO ---
  - id: tado_modal_open
    type: bool
    restore_value: false
    initial_value: 'false'

  # Popin clavier
  - id: pin_modal_active
    type: bool
    initial_value: 'false'

  - id: pin_buffer
    type: std::string
    restore_value: false
    initial_value: '""'

  - id: pin_length
    type: int
    initial_value: '0'

  - id: pin_idle_counter
    type: int
    initial_value: '0'

  - id: keypad_message
    type: std::string
    restore_value: false
    initial_value: '""'

  - id: msg_display_counter
    type: int
    initial_value: '0'

  - id: bypass_warning_active
    type: bool
    initial_value: 'false'

  - id: bypass_timeout_counter
    type: int
    initial_value: '0'

  - id: target_arm_mode
    type: int
    initial_value: '0'

  - id: alarm_bypassed
    type: bool
    restore_value: false
    initial_value: 'false'

  - id: screen_alert_active
    type: bool
    initial_value: 'false'

  - id: alert_blink_counter
    type: int
    initial_value: '0'

  - id: brightness_level
    type: int
    restore_value: true
    initial_value: '3'

  - id: sos_confirm_active
    type: bool
    initial_value: 'false'

  - id: sos_confirm_counter
    type: int
    initial_value: '0'

  - id: reboot_confirm_active
    type: bool
    initial_value: 'false'

  - id: reboot_confirm_counter
    type: int
    initial_value: '0'

# =============================================================================
#  SCRIPTS SYSTÈME (ASYNCHRONES SÉCURISÉS)
# =============================================================================
script:
  - id: set_brightness
    parameters:
      level: int
    then:
      - lambda: |-
          static const float v[] = {0.25f, 0.50f, 0.75f, 1.0f};
          if (level < 0 || level > 3) level = 3;
          id(brightness_level) = level;
          auto call = id(display_backlight).turn_on();
          call.set_brightness(v[level]);
          call.perform();
          id(need_redraw) = true;

  - id: ha_arm_away_svc
    mode: restart
    then:
      - delay: 50ms
      - homeassistant.action:
          action: alarm_control_panel.alarm_arm_away
          data:
            entity_id: ${ha_alarm_entity}

  # FIX v2.2.3 : force revient en chaîne "true" (avec guillemets).
  # Test confirmé : le service HA rejette un booléen natif pour ce paramètre
  # ("Must be string, got <class 'bool'>"). Le schéma attend bien une string.
  - id: ha_arm_away_force_svc
    mode: restart
    then:
      - delay: 50ms
      - homeassistant.action:
          action: alarm_control_panel.alarm_arm_away
          data:
            entity_id: ${ha_alarm_entity}
            force: "true"

  - id: ha_arm_night_svc
    mode: restart
    then:
      - delay: 50ms
      - homeassistant.action:
          action: alarm_control_panel.alarm_arm_night
          data:
            entity_id: ${ha_alarm_entity}

  - id: ha_arm_night_force_svc
    mode: restart
    then:
      - delay: 50ms
      - homeassistant.action:
          action: alarm_control_panel.alarm_arm_night
          data:
            entity_id: ${ha_alarm_entity}
            force: "true"

  - id: ha_disarm_svc
    mode: restart
    parameters:
      code: string
    then:
      - delay: 50ms
      - homeassistant.action:
          action: alarm_control_panel.alarm_disarm
          data:
            entity_id: ${ha_alarm_entity}
            code: !lambda 'return code;'

  - id: ha_sos_svc
    mode: restart
    then:
      - delay: 50ms
      - homeassistant.action:
          action: button.press
          data:
            entity_id: ${ha_alarm_sos}

  # --- SCRIPTS ONGLET MAISON ---
  - id: ha_portail_svc
    mode: restart
    then:
      - delay: 50ms
      - homeassistant.action:
          action: switch.turn_on
          data:
            entity_id: switch.shelly_ouverture_portail_voiture

  - id: ha_lumieres_on_svc
    mode: restart
    then:
      - delay: 50ms
      - homeassistant.action:
          action: script.allumer_les_lumieres_exterieures

  - id: ha_lumieres_off_svc
    mode: restart
    then:
      - delay: 50ms
      - homeassistant.action:
          action: script.eteindre_les_lumieres_exterieures

  - id: ha_arrosage_toggle_svc
    mode: restart
    then:
      - delay: 50ms
      - homeassistant.action:
          action: switch.toggle
          data:
            entity_id: switch.gpioarrosagev6_lancer_5_mn_d_arrosage

  # --- SCRIPTS ONGLET TADO (CHAUFFAGE) ---
  - id: ha_tado_auto_svc
    mode: restart
    then:
      - delay: 50ms
      - homeassistant.action:
          action: domolink_tado.resume_all_schedules

  - id: ha_tado_boost_svc
    mode: restart
    then:
      - delay: 50ms
      - homeassistant.action:
          action: domolink_tado.set_boost

  - id: ha_tado_eco_svc
    mode: restart
    then:
      - delay: 50ms
      - homeassistant.action:
          action: domolink_tado.set_eco_all

  - id: ha_tado_off_svc
    mode: restart
    then:
      - delay: 50ms
      - homeassistant.action:
          action: domolink_tado.set_all_off

  - id: ha_tado_set_temp_svc
    mode: restart
    parameters:
      entity_id: string
      target_temp: float
    then:
      - delay: 50ms
      - homeassistant.action:
          action: climate.set_temperature
          data:
            entity_id: !lambda "return entity_id;"
            temperature: !lambda "return target_temp;"

  - id: ha_purifier_toggle_svc
    then:
      - homeassistant.action:
          action: fan.toggle
          data:
            entity_id: ${ha_purifier_fan_entity}

  - id: ha_tado_room_hvac_mode_svc
    mode: restart
    parameters:
      entity_id: string
      mode: string
    then:
      - delay: 50ms
      - homeassistant.action:
          action: climate.set_hvac_mode
          data:
            entity_id: !lambda "return entity_id;"
            hvac_mode: !lambda "return mode;"

  # --- SCRIPTS ONGLET ARROSAGE (ZONES & ACTIONS) ---
  - id: ha_arr_z1_svc
    mode: restart
    then:
      - delay: 50ms
      - homeassistant.action:
          action: switch.toggle
          data:
            entity_id: switch.gpioarrosagev6_1_le_jardin_c_t_droit

  - id: ha_arr_z2_svc
    mode: restart
    then:
      - delay: 50ms
      - homeassistant.action:
          action: switch.toggle
          data:
            entity_id: switch.gpioarrosagev6_2_le_jardin_c_t_gauche

  - id: ha_arr_z3_svc
    mode: restart
    then:
      - delay: 50ms
      - homeassistant.action:
          action: switch.toggle
          data:
            entity_id: switch.gpioarrosagev6_3_les_bordures

  - id: ha_arr_z4_svc
    mode: restart
    then:
      - delay: 50ms
      - homeassistant.action:
          action: switch.toggle
          data:
            entity_id: switch.gpioarrosagev6_4_le_potager

  - id: ha_arr_z5_svc
    mode: restart
    then:
      - delay: 50ms
      - homeassistant.action:
          action: switch.toggle
          data:
            entity_id: switch.gpioarrosagev6_5_les_bambous

  - id: ha_arr_5m_svc
    mode: restart
    then:
      - delay: 50ms
      - homeassistant.action:
          action: switch.toggle
          data:
            entity_id: switch.gpioarrosagev6_lancer_5_mn_d_arrosage

  - id: ha_arr_10m_svc
    mode: restart
    then:
      - delay: 50ms
      - homeassistant.action:
          action: switch.toggle
          data:
            entity_id: switch.gpioarrosagev6_lancer_10_mn_d_arrosage

  - id: ha_arr_stop_svc
    mode: restart
    then:
      - delay: 50ms
      - homeassistant.action:
          action: switch.turn_on
          data:
            entity_id: switch.gpioarrosagev6_reboot_gpio_arrosage_v6

# =============================================================================
#  BOUTONS & SÉLECTEUR WEB
# =============================================================================
button:
  - platform: restart
    name: "Redémarrer l'écran"
    icon: "mdi:restart"

  - platform: template
    name: "Déclencher SOS Panique"
    icon: "mdi:alert-octagon"
    on_press:
      - script.execute: ha_sos_svc

select:
  - platform: template
    name: "Onglet affiché"
    id: web_select_tab
    icon: "mdi:tab"
    optimistic: true
    options:
      - "Maison"
      - "Tado"
      - "Trains"
      - "Arrosage"
      - "Alarme"
      - "Capteurs"
      - "Système"
    initial_option: "Maison"
    set_action:
      - lambda: |-
          if (x == "Maison") id(display_page) = 0;
          else if (x == "Tado") id(display_page) = 1;
          else if (x == "Trains") id(display_page) = 2;
          else if (x == "Arrosage") id(display_page) = 3;
          else if (x == "Alarme") id(display_page) = 4;
          else if (x == "Capteurs") id(display_page) = 5;
          else if (x == "Système") id(display_page) = 6;
          id(need_redraw) = true;

# =============================================================================
#  INTERVALLES / TIMERS
# =============================================================================
interval:
  # Render coalescer réactif (25ms pour une réponse quasi-instantanée)
  - interval: 25ms
    then:
      - lambda: |-
          if (id(need_redraw)) {
            id(need_redraw) = false;
            id(my_display).update();
          }

  - interval: 250ms
    then:
      - lambda: |-
          if (!id(boot_done)) {
            bool c_wifi    = id(my_wifi).is_connected();
            bool c_api     = api_is_connected();
            bool c_time    = id(ha_time).now().is_valid();
            bool c_alarm   = id(ha_alarm_state).has_state();
            bool c_open    = id(ha_openings).has_state();
            bool c_motion  = id(ha_motions).has_state();

            static int last_score = -1;
            int score = (c_wifi ? 1 : 0) + (c_api ? 1 : 0) + (c_time ? 1 : 0) + (c_alarm ? 1 : 0) + (c_open ? 1 : 0) + (c_motion ? 1 : 0);

            if (score != last_score) {
              last_score = score;
              id(need_redraw) = true;
            }

            // Réduction du timeout max pour ne pas bloquer l'écran à vie
            if (score == 6 || millis() > 15000) {
              id(boot_done) = true;
              id(display_page) = 0;
              id(need_redraw) = true;
            }
          }

  - interval: 1s
    then:
      - lambda: |-
          if (!id(boot_done)) return;
          bool dirty = false;

          // Sécurité Bypass State
          if (id(ha_alarm_state).state == "disarmed") {
            id(alarm_bypassed) = false;
          }

          // Sécurité / Timeout action portail (15 secondes max)
          if (id(gate_action_state) != 0) {
            if (millis() - id(gate_action_start_ms) >= 15000) {
              id(gate_action_state) = 0;
              dirty = true;
            }
          }

          // Timeout modale PIN
          if (id(pin_modal_active)) {
            id(pin_idle_counter)++;
            if (id(pin_idle_counter) >= 15) {
              id(pin_buffer).clear();
              id(pin_length) = 0;
              id(pin_idle_counter) = 0;
              id(pin_modal_active) = false;
              dirty = true;
            }
          }

          // Timeout modale Bypass Warning
          if (id(bypass_warning_active)) {
            id(bypass_timeout_counter)++;
            if (id(bypass_timeout_counter) >= 15) {
              id(bypass_warning_active) = false;
              id(target_arm_mode) = 0;
              id(bypass_timeout_counter) = 0;
              dirty = true;
            }
          }

          if (!id(keypad_message).empty()) {
            id(msg_display_counter)++;
            if (id(msg_display_counter) >= 4) {
              id(keypad_message).clear();
              id(msg_display_counter) = 0;
              dirty = true;
            }
          }

          if (id(screen_alert_active) || id(ha_alarm_state).state == "triggered") {
            id(alert_blink_counter)++;
            dirty = true;
            if (id(alert_blink_counter) > 30 && id(ha_alarm_state).state != "triggered") {
              id(screen_alert_active) = false;
              id(alert_blink_counter) = 0;
            }
          }

          if (id(sos_confirm_active)) {
            id(sos_confirm_counter)++;
            if (id(sos_confirm_counter) >= 10) {
              id(sos_confirm_active) = false;
              id(sos_confirm_counter) = 0;
              dirty = true;
            }
          }

          if (id(reboot_confirm_active)) {
            id(reboot_confirm_counter)++;
            if (id(reboot_confirm_counter) >= 10) {
              id(reboot_confirm_active) = false;
              id(reboot_confirm_counter) = 0;
              dirty = true;
            }
          }

          static int last_min = -1;
          auto t = id(ha_time).now();
          if (t.is_valid() && t.minute != last_min) {
            last_min = t.minute;
            dirty = true;
          }

          if (dirty) id(need_redraw) = true;

# =============================================================================
#  BUS I2C & ÉCRAN TACTILE GT911
# =============================================================================
i2c:
  - id: bus_a
    sda: 19
    scl: 20
    frequency: 400kHz
    scan: true

touchscreen:
  platform: gt911
  id: my_touchscreen
  i2c_id: bus_a
  address: 0x5D
  transform:
    swap_xy: false
    mirror_x: false
    mirror_y: false
  on_touch:
    - lambda: |-
        if (!id(boot_done)) return;

        static uint32_t last_action_ms = 0;
        uint32_t now = millis();
        if (now - last_action_ms < 200) return;

        int x = touch.x;
        int y = touch.y;

        // -------------------------------------------------------------
        // 1. POPIN D'AVERTISSEMENT OUVERTURES (PRIORITÉ Z-INDEX MAX)
        // -------------------------------------------------------------
        if (id(bypass_warning_active)) {
          id(bypass_timeout_counter) = 0;

          if (x >= 120 && x <= 370 && y >= 280 && y <= 340) {
            last_action_ms = now;
            id(bypass_warning_active) = false;
            id(target_arm_mode) = 0;
            id(keypad_message) = "ARMEMENT ANNULE";
            id(msg_display_counter) = 0;
            id(need_redraw) = true;
            return;
          }
          if (x >= 430 && x <= 680 && y >= 280 && y <= 340) {
            last_action_ms = now;
            id(bypass_warning_active) = false;
            id(alarm_bypassed) = true;
            if (id(target_arm_mode) == 1) {
              id(ha_arm_away_force_svc).execute();
              id(keypad_message) = "ARME AVEC BYPASS";
            } else if (id(target_arm_mode) == 2) {
              id(ha_arm_night_force_svc).execute();
              id(keypad_message) = "NUIT AVEC BYPASS";
            }
            id(target_arm_mode) = 0;
            id(msg_display_counter) = 0;
            id(need_redraw) = true;
            return;
          }
          return;
        }

        // -------------------------------------------------------------
        // 2. POPIN MODALE CLAVIER PIN DÉSARMEMENT (Z-INDEX 2)
        // -------------------------------------------------------------
        if (id(pin_modal_active)) {
          if (x >= 510 && x <= 600 && y >= 20 && y <= 90) {
            last_action_ms = now;
            id(pin_modal_active) = false;
            id(pin_buffer).clear();
            id(pin_length) = 0;
            id(need_redraw) = true;
            return;
          }

          if (x >= 245 && x <= 545 && y >= 110 && y <= 375) {
            int col = (x - 245) / 105;
            int row = (y - 110) / 70;
            if (col > 2) col = 2;
            if (row > 3) row = 3;

            id(pin_idle_counter) = 0;

            if (row < 3) {
              char digit = '1' + (row * 3 + col);
              if (id(pin_length) < 8) {
                id(pin_buffer) += digit;
                id(pin_length)++;
              }
            } else {
              if (col == 0) {
                id(pin_buffer).clear();
                id(pin_length) = 0;
                id(keypad_message).clear();
                id(msg_display_counter) = 0;
              } else if (col == 1) {
                if (id(pin_length) < 8) {
                  id(pin_buffer) += '0';
                  id(pin_length)++;
                }
              } else if (col == 2) {
                if (!api_is_connected()) {
                  id(keypad_message) = "HA HORS LIGNE";
                  id(msg_display_counter) = 0;
                  id(need_redraw) = true;
                  return;
                }

                if (id(pin_length) >= 4) {
                  std::string code = id(pin_buffer);
                  id(ha_disarm_svc).execute(code);
                  id(keypad_message) = "TRAITEMENT...";
                  id(alarm_bypassed) = false;
                  id(msg_display_counter) = 0;
                  id(pin_buffer).clear();
                  id(pin_length) = 0;
                  id(pin_idle_counter) = 0;
                  id(pin_modal_active) = false;
                } else {
                  id(keypad_message) = "CODE TROP COURT";
                  id(msg_display_counter) = 0;
                }
              }
            }
            last_action_ms = now;
            id(need_redraw) = true;
            return;
          }
          return;
        }

        // -------------------------------------------------------------
        // 3. BARRE DE NAVIGATION INFÉRIEURE (9 ONGLETS DE ~88PX)
        // -------------------------------------------------------------
        if (y >= 415) {
          int next_page = id(display_page);
          std::string tab_name = "Maison";
          if (x < 88) { next_page = 0; tab_name = "Maison"; }
          else if (x < 177) { next_page = 1; tab_name = "Tado"; }
          else if (x < 266) { next_page = 2; tab_name = "Énergie"; }
          else if (x < 355) { next_page = 3; tab_name = "Air"; }
          else if (x < 444) { next_page = 4; tab_name = "Trains"; }
          else if (x < 533) { next_page = 5; tab_name = "Arrosage"; }
          else if (x < 622) { next_page = 6; tab_name = "Alarme"; }
          else if (x < 711) { next_page = 7; tab_name = "Capteurs"; }
          else { next_page = 8; tab_name = "Système"; }

          if (next_page != id(display_page)) {
            last_action_ms = now;
            id(display_page) = next_page;
            id(tado_modal_open) = false;
            id(sos_confirm_active) = false;
            id(sos_confirm_counter) = 0;
            id(reboot_confirm_active) = false;
            id(reboot_confirm_counter) = 0;

            id(web_select_tab).publish_state(tab_name);
            id(need_redraw) = true;
          }
          return;
        }

        // -------------------------------------------------------------
        // 4. PAGE 0 : MAISON (PORTAIL, LUMIÈRES, HORLOGE)
        // -------------------------------------------------------------
        if (id(display_page) == 0) {
          // Bouton Portail (x: 24-262, y: 60-185)
          if (x >= 24 && x <= 262 && y >= 60 && y <= 185) {
            last_action_ms = now;
            if (api_is_connected()) {
              id(ha_portail_svc).execute();
              bool is_open = id(ha_portail_state).has_state() && id(ha_portail_state).state;
              id(gate_action_state) = is_open ? 2 : 1;
              id(gate_action_start_ms) = millis();
            }
            id(need_redraw) = true;
            return;
          }

          // Bouton Lumières extérieures (x: 281-519, y: 60-185)
          if (x >= 281 && x <= 519 && y >= 60 && y <= 185) {
            last_action_ms = now;
            if (api_is_connected()) {
              if (id(ha_lumieres_ext).has_state() && id(ha_lumieres_ext).state) {
                id(ha_lumieres_off_svc).execute();
              } else {
                id(ha_lumieres_on_svc).execute();
              }
            }
            id(need_redraw) = true;
            return;
          }

          // Tuile Heure (x: 538-776, y: 60-185) -> Raccourci vers Onglet Arrosage
          if (x >= 538 && x <= 776 && y >= 60 && y <= 185) {
            last_action_ms = now;
            id(display_page) = 5;
            id(web_select_tab).publish_state("Arrosage");
            id(need_redraw) = true;
            return;
          }
          return;
        }

        // -------------------------------------------------------------
        // 5. PAGE 1 : TADO (CHAUFFAGE GLOBAL & MODAL PAR PIÈCE)
        // -------------------------------------------------------------
        if (id(display_page) == 1) {
          // Si la popin modale de la pièce est ouverte
          if (id(tado_modal_open)) {
            // 1. Bouton FERMER (x: 610-745, y: 55-102)
            if (x >= 610 && x <= 745 && y >= 55 && y <= 102) {
              last_action_ms = now;
              id(tado_modal_open) = false;
              id(need_redraw) = true;
              return;
            }

            int r_idx = id(tado_selected_room);
            std::string t_entity = "climate.salon";
            float cur_target = 20.0f;
            if (r_idx == 0) { t_entity = "climate.salon"; cur_target = id(ha_tado_salon_tgt).state; }
            else if (r_idx == 1) { t_entity = "climate.cuisine"; cur_target = id(ha_tado_cuisine_tgt).state; }
            else if (r_idx == 2) { t_entity = "climate.salle_a_manger"; cur_target = id(ha_tado_sam_tgt).state; }
            else if (r_idx == 3) { t_entity = "climate.chambre_stef_et_jf"; cur_target = id(ha_tado_ch_stef_tgt).state; }
            else if (r_idx == 4) { t_entity = "climate.chambre_de_blaise"; cur_target = id(ha_tado_ch_blaise_tgt).state; }
            else if (r_idx == 5) { t_entity = "climate.chambre_de_lia"; cur_target = id(ha_tado_ch_lia_tgt).state; }
            else if (r_idx == 6) { t_entity = "climate.bureau_jf"; cur_target = id(ha_tado_bureau_tgt).state; }
            else if (r_idx == 7) { t_entity = "climate.salle_de_bains"; cur_target = id(ha_tado_sdb_tgt).state; }
            if (std::isnan(cur_target) || cur_target < 5.0f) cur_target = 19.0f;

            // 2. Boutons ajustement consigne [- 0.5°] (x: 255-355) et [+ 0.5°] (x: 630-740)
            if (y >= 114 && y <= 216) {
              if (x >= 255 && x <= 355) {
                last_action_ms = now;
                cur_target -= 0.5f;
                if (cur_target < 5.0f) cur_target = 5.0f;
                if (api_is_connected()) id(ha_tado_set_temp_svc).execute(t_entity, cur_target);
                id(need_redraw) = true;
                return;
              }
              if (x >= 630 && x <= 740) {
                last_action_ms = now;
                cur_target += 0.5f;
                if (cur_target > 30.0f) cur_target = 30.0f;
                if (api_is_connected()) id(ha_tado_set_temp_svc).execute(t_entity, cur_target);
                id(need_redraw) = true;
                return;
              }
            }

            // 3. Modes rapides (y: 226-298) : AUTO, BOOST 25°, ÉCO 17°, ÉTEINDRE
            if (y >= 226 && y <= 298) {
              last_action_ms = now;
              if (x >= 54 && x <= 216) {
                if (api_is_connected()) id(ha_tado_room_hvac_mode_svc).execute(t_entity, "auto");
              } else if (x >= 226 && x <= 384) {
                if (api_is_connected()) {
                  id(ha_tado_set_temp_svc).execute(t_entity, 25.0f);
                  id(ha_tado_room_hvac_mode_svc).execute(t_entity, "heat");
                }
              } else if (x >= 394 && x <= 552) {
                if (api_is_connected()) {
                  id(ha_tado_set_temp_svc).execute(t_entity, 17.0f);
                  id(ha_tado_room_hvac_mode_svc).execute(t_entity, "heat");
                }
              } else if (x >= 562 && x <= 726) {
                if (api_is_connected()) id(ha_tado_room_hvac_mode_svc).execute(t_entity, "off");
              }
              id(need_redraw) = true;
              return;
            }

            // 4. Presets rapides directs (y: 308-368) : 17°, 18°, 19°, 20°, 21°, 22°, 23°
            if (y >= 308 && y <= 368) {
              last_action_ms = now;
              for (int p_idx = 0; p_idx < 7; p_idx++) {
                int px1 = 54 + p_idx * 99;
                int px2 = px1 + 90;
                if (x >= px1 && x <= px2) {
                  float p_temp = 17.0f + (float)p_idx;
                  if (api_is_connected()) id(ha_tado_set_temp_svc).execute(t_entity, p_temp);
                  id(need_redraw) = true;
                  return;
                }
              }
            }

            // Clic hors cadre modale : ferme la modale
            if (x < 40 || x > 760 || y < 50 || y > 414) {
              last_action_ms = now;
              id(tado_modal_open) = false;
              id(need_redraw) = true;
              return;
            }
            return;
          }

          // Si la popin n'est pas ouverte :
          // Actions Globales (y: 52 à 106)
          if (y >= 52 && y <= 106) {
            last_action_ms = now;
            if (api_is_connected()) {
              if (x >= 24 && x <= 204) id(ha_tado_auto_svc).execute();
              else if (x >= 214 && x <= 394) id(ha_tado_boost_svc).execute();
              else if (x >= 404 && x <= 584) id(ha_tado_eco_svc).execute();
              else if (x >= 594 && x <= 776) id(ha_tado_off_svc).execute();
            }
            id(need_redraw) = true;
            return;
          }

          // Grille des 8 pièces Tado (y: 110 à 356) -> Ouvre le menu modale de la pièce
          // Ligne 1 : y: 110 à 228
          if (y >= 110 && y <= 228) {
            last_action_ms = now;
            if (x >= 24 && x <= 204) id(tado_selected_room) = 0;       // Salon
            else if (x >= 214 && x <= 394) id(tado_selected_room) = 1; // Cuisine
            else if (x >= 404 && x <= 584) id(tado_selected_room) = 2; // Salle à Manger
            else if (x >= 594 && x <= 776) id(tado_selected_room) = 3; // Ch. Stef & JF
            id(tado_modal_open) = true;
            id(need_redraw) = true;
            return;
          }
          // Ligne 2 : y: 238 à 356
          if (y >= 238 && y <= 356) {
            last_action_ms = now;
            if (x >= 24 && x <= 204) id(tado_selected_room) = 4;       // Ch. Blaise
            else if (x >= 214 && x <= 394) id(tado_selected_room) = 5; // Ch. Lia
            else if (x >= 404 && x <= 584) id(tado_selected_room) = 6; // Bureau JF
            else if (x >= 594 && x <= 776) id(tado_selected_room) = 7; // SDB
            id(tado_modal_open) = true;
            id(need_redraw) = true;
            return;
          }
          return;
        }

        // -------------------------------------------------------------
        // 6. PAGE 2 : TRAINS (LECTURE SEULE)
        // -------------------------------------------------------------
        if (id(display_page) == 2) {
          return;
        }

        // -------------------------------------------------------------
        // 7. PAGE 3 : ARROSAGE AUTOMATIQUE (5 ZONES & CYCLES)
        // -------------------------------------------------------------
        if (id(display_page) == 3) {
          // Les 5 Zones d'arrosage (y: 130 à 290)
          if (y >= 130 && y <= 290) {
            last_action_ms = now;
            if (api_is_connected()) {
              if (x >= 24 && x <= 166) id(ha_arr_z1_svc).execute();
              else if (x >= 178 && x <= 320) id(ha_arr_z2_svc).execute();
              else if (x >= 332 && x <= 474) id(ha_arr_z3_svc).execute();
              else if (x >= 486 && x <= 628) id(ha_arr_z4_svc).execute();
              else if (x >= 640 && x <= 776) id(ha_arr_z5_svc).execute();
            }
            id(need_redraw) = true;
            return;
          }

          // Les 3 Boutons d'action rapide (y: 304 à 416)
          if (y >= 304 && y <= 416) {
            last_action_ms = now;
            if (api_is_connected()) {
              if (x >= 24 && x <= 264) id(ha_arr_5m_svc).execute();
              else if (x >= 280 && x <= 520) id(ha_arr_10m_svc).execute();
              else if (x >= 536 && x <= 776) id(ha_arr_stop_svc).execute();
            }
            id(need_redraw) = true;
            return;
          }
          return;
        }

        // -------------------------------------------------------------
        // 8. PAGE 4 : ALARME
        // -------------------------------------------------------------
        if (id(display_page) == 4) {
          bool open_known = id(ha_openings).has_state();
          bool has_issue  = (!open_known) || (open_known && id(ha_openings).state);

          if (x >= 40 && x <= 270 && y >= 280 && y <= 335) {
            last_action_ms = now;
            if (!api_is_connected()) {
              id(keypad_message) = "HA HORS LIGNE";
              id(msg_display_counter) = 0;
              id(need_redraw) = true;
              return;
            }
            if (has_issue) {
              id(bypass_warning_active) = true;
              id(target_arm_mode) = 1;
              id(bypass_timeout_counter) = 0;
              id(need_redraw) = true;
              return;
            }
            id(ha_arm_away_svc).execute();
            id(alarm_bypassed) = false;
            id(keypad_message) = "ARMEMENT TOTAL";
            id(msg_display_counter) = 0;
            id(need_redraw) = true;
            return;
          }

          if (x >= 285 && x <= 515 && y >= 280 && y <= 335) {
            last_action_ms = now;
            if (!api_is_connected()) {
              id(keypad_message) = "HA HORS LIGNE";
              id(msg_display_counter) = 0;
              id(need_redraw) = true;
              return;
            }
            if (has_issue) {
              id(bypass_warning_active) = true;
              id(target_arm_mode) = 2;
              id(bypass_timeout_counter) = 0;
              id(need_redraw) = true;
              return;
            }
            id(ha_arm_night_svc).execute();
            id(alarm_bypassed) = false;
            id(keypad_message) = "ARMEMENT NUIT";
            id(msg_display_counter) = 0;
            id(need_redraw) = true;
            return;
          }

          if (x >= 530 && x <= 760 && y >= 280 && y <= 335) {
            last_action_ms = now;
            id(pin_modal_active) = true;
            id(pin_idle_counter) = 0;
            id(pin_buffer).clear();
            id(pin_length) = 0;
            id(need_redraw) = true;
            return;
          }

          if (x >= 40 && x <= 760 && y >= 355 && y <= 405) {
            last_action_ms = now;
            if (!id(sos_confirm_active)) {
              id(sos_confirm_active) = true;
              id(sos_confirm_counter) = 0;
            } else {
              if (!api_is_connected()) {
                id(keypad_message) = "HA HORS LIGNE";
              } else {
                id(ha_sos_svc).execute();
                id(keypad_message) = "SOS TRANSMIS !";
              }
              id(sos_confirm_active) = false;
              id(sos_confirm_counter) = 0;
              id(msg_display_counter) = 0;
            }
            id(need_redraw) = true;
            return;
          }
          return;
        }

        // -------------------------------------------------------------
        // 9. PAGE 5 : CAPTEURS (LECTURE SEULE)
        // -------------------------------------------------------------
        if (id(display_page) == 5) {
          return;
        }

        // -------------------------------------------------------------
        // 10. PAGE 6 : SYSTÈME
        // -------------------------------------------------------------
        if (id(display_page) == 6) {
          if (y >= 190 && y <= 245) {
            int lvl = -1;
            if (x >= 50 && x <= 200) lvl = 0;
            else if (x >= 210 && x <= 360) lvl = 1;
            else if (x >= 370 && x <= 520) lvl = 2;
            else if (x >= 530 && x <= 700) lvl = 3;
            if (lvl >= 0) {
              last_action_ms = now;
              id(set_brightness).execute(lvl);
              id(need_redraw) = true;
            }
            return;
          }
          if (x >= 250 && x <= 550 && y >= 320 && y <= 375) {
            last_action_ms = now;
            if (!id(reboot_confirm_active)) {
              id(reboot_confirm_active) = true;
              id(reboot_confirm_counter) = 0;
              id(need_redraw) = true;
            } else {
              App.safe_reboot();
            }
            return;
          }
          return;
        }

