# =============================================================================
#  ÉCRAN MIPI RGB 800x480
# =============================================================================
display:
  - platform: mipi_rgb
    model: RPI
    id: my_display
    color_order: rgb
    invert_colors: true
    update_interval: never
    auto_clear_enabled: false
    dimensions:
      width: 800
      height: 480
    de_pin: 41
    hsync_pin: 39
    vsync_pin: 40
    pclk_pin: 42
    pclk_frequency: 16MHz
    pclk_inverted: true
    hsync_pulse_width: 4
    hsync_back_porch: 40
    hsync_front_porch: 48
    vsync_pulse_width: 4
    vsync_back_porch: 31
    vsync_front_porch: 13
    data_pins:
      red: [14, 21, 47, 48, 45]
      green: [9, 46, 3, 8, 16, 1]
      blue: [15, 7, 6, 5, 4]
    lambda: |-
      const auto COLOR_BG            = Color(14, 17, 23);
      const auto COLOR_PANEL_BG      = Color(24, 28, 38);
      const auto COLOR_CARD_BORDER   = Color(42, 48, 64);
      const auto COLOR_WHITE         = Color(255, 255, 255);
      const auto COLOR_LIGHT_GRAY    = Color(195, 202, 216);
      const auto COLOR_DARK_GRAY     = Color(90, 98, 115);
      const auto COLOR_MID_GRAY      = Color(48, 54, 70);
      const auto COLOR_GREEN         = Color(0, 230, 118);
      const auto COLOR_GREEN_DIM     = Color(0, 55, 30);
      const auto COLOR_RED           = Color(255, 23, 68);
      const auto COLOR_RED_DIM       = Color(60, 10, 20);
      const auto COLOR_ORANGE        = Color(255, 145, 0);
      const auto COLOR_ORANGE_DIM    = Color(60, 35, 10);
      const auto COLOR_CYAN          = Color(0, 229, 255);
      const auto COLOR_BLUE          = Color(41, 121, 255);

      auto draw_rrect = [&](int x, int y, int w, int h, int r, Color color) {
        if (r > w/2) r = w/2;
        if (r > h/2) r = h/2;
        it.filled_rectangle(x + r, y, w - 2 * r, h, color);
        it.filled_rectangle(x, y + r, r, h - 2 * r, color);
        it.filled_rectangle(x + w - r, y + r, r, h - 2 * r, color);
        it.filled_circle(x + r, y + r, r, color);
        it.filled_circle(x + w - r - 1, y + r, r, color);
        it.filled_circle(x + r, y + h - r - 1, r, color);
        it.filled_circle(x + w - r - 1, y + h - r - 1, r, color);
      };

      it.filled_rectangle(0, 0, 800, 480, COLOR_BG);

      // =============================================================
      // ÉCRAN DE BOOT
      // =============================================================
      if (!id(boot_done)) {
        bool c_wifi    = id(my_wifi).is_connected();
        bool c_api     = api_is_connected();
        bool c_time    = id(ha_time).now().is_valid();
        bool c_alarm   = id(ha_alarm_state).has_state();
        bool c_open    = id(ha_openings).has_state();
        bool c_motion  = id(ha_motions).has_state();

        int score = (c_wifi ? 1 : 0) + (c_api ? 1 : 0) + (c_time ? 1 : 0) + (c_alarm ? 1 : 0) + (c_open ? 1 : 0) + (c_motion ? 1 : 0);

        it.printf(400, 45, id(font_32), COLOR_CYAN, TextAlign::CENTER, "DOMOLINK ALARM");
        it.printf(400, 85, id(font_20), COLOR_LIGHT_GRAY, TextAlign::CENTER, "Initialisation et verification des liaisons...");

        draw_rrect(150, 125, 500, 6, 3, COLOR_MID_GRAY);
        int bar_fill = (score * 500) / 6;
        if (bar_fill > 0) draw_rrect(150, 125, bar_fill, 6, 3, (score == 6) ? COLOR_GREEN : COLOR_CYAN);

        const int start_y = 150;
        const int line_h  = 38;
        it.printf(160, start_y, id(font_20), c_wifi ? COLOR_GREEN : COLOR_DARK_GRAY, TextAlign::CENTER_LEFT, c_wifi ? "[OK] Connexion reseau Wi-Fi" : "[..] Connexion reseau Wi-Fi en cours...");
        it.printf(160, start_y + line_h, id(font_20), c_api ? COLOR_GREEN : COLOR_DARK_GRAY, TextAlign::CENTER_LEFT, c_api ? "[OK] Liaison API Home Assistant" : "[..] Attente liaison API...");
        it.printf(160, start_y + line_h * 2, id(font_20), c_time ? COLOR_GREEN : COLOR_DARK_GRAY, TextAlign::CENTER_LEFT, c_time ? "[OK] Synchronisation horloge temps reel" : "[..] Synchronisation horloge NTP/HA...");
        it.printf(160, start_y + line_h * 3, id(font_20), c_alarm ? COLOR_GREEN : COLOR_DARK_GRAY, TextAlign::CENTER_LEFT, c_alarm ? "[OK] Centrale d'alarme en ligne" : "[..] Attente statut centrale...");
        it.printf(160, start_y + line_h * 4, id(font_20), c_open ? COLOR_GREEN : COLOR_DARK_GRAY, TextAlign::CENTER_LEFT, c_open ? "[OK] Capteurs d'ouvertures synchronises" : "[..] Attente remontee ouvertures...");
        it.printf(160, start_y + line_h * 5, id(font_20), c_motion ? COLOR_GREEN : COLOR_DARK_GRAY, TextAlign::CENTER_LEFT, c_motion ? "[OK] Capteurs de mouvements synchronises" : "[..] Attente remontee mouvements...");

        it.printf(400, 425, id(font_16), COLOR_DARK_GRAY, TextAlign::CENTER, "Veuillez patienter pendant la synchronisation du panneau");
        return;
      }

      // =============================================================
      // HEADER FIXE (y: 0-48)
      // =============================================================
      it.filled_rectangle(0, 0, 800, 48, COLOR_PANEL_BG);
      it.line(0, 48, 800, 48, COLOR_CARD_BORDER);

      it.printf(20, 24, id(font_24), COLOR_WHITE, TextAlign::CENTER_LEFT, "DOMOLINK ALARM");

      bool ha_ok = api_is_connected();
      std::string alarm_st = id(ha_alarm_state).state;

      char time_str[16] = "--:--";
      auto now = id(ha_time).now();
      if (now.is_valid()) now.strftime(time_str, sizeof(time_str), "%H:%M");

      int current_p = id(display_page);

      // Détection de l'arrosage en cours pour le header
      std::string active_irr_zone = "";
      if (id(ha_arr_z1).has_state() && id(ha_arr_z1).state) active_irr_zone = "Jardin Droit";
      else if (id(ha_arr_z2).has_state() && id(ha_arr_z2).state) active_irr_zone = "Jardin Gauche";
      else if (id(ha_arr_z3).has_state() && id(ha_arr_z3).state) active_irr_zone = "Bordures";
      else if (id(ha_arr_z4).has_state() && id(ha_arr_z4).state) active_irr_zone = "Potager";
      else if (id(ha_arr_z5).has_state() && id(ha_arr_z5).state) active_irr_zone = "Bambous";
      else if (id(ha_arrosage_active).has_state() && id(ha_arrosage_active).state) active_irr_zone = "Actif";

      // Emplacement de l'heure dans le header (x: 685) :
      // Sur la page maison (page 0) : Si arrosage en cours -> zone arrosée. Si pas en route -> rien !
      if (current_p == 0) {
        if (!active_irr_zone.empty()) {
          draw_rrect(490, 10, 245, 28, 8, COLOR_CYAN);
          it.printf(612, 24, id(font_16), COLOR_PANEL_BG, TextAlign::CENTER, "ARROSAGE : %s", active_irr_zone.c_str());
        }
      } else {
        if (!active_irr_zone.empty()) {
          draw_rrect(440, 10, 220, 28, 8, COLOR_CYAN);
          it.printf(550, 24, id(font_16), COLOR_PANEL_BG, TextAlign::CENTER, "ARROSAGE : %s", active_irr_zone.c_str());
        }
        it.printf(685, 24, id(font_20), COLOR_LIGHT_GRAY, TextAlign::CENTER_RIGHT, "%s", time_str);
      }

      float rssi = id(wifi_rssi).state;
      int bars = (!std::isnan(rssi)) ? ((rssi > -60) ? 4 : ((rssi > -70) ? 3 : ((rssi > -80) ? 2 : 1))) : 0;
      for (int b = 0; b < 4; b++) {
        int bar_h = (b + 1) * 5;
        int bx = 770 + (b * 7);
        int by = 35 - bar_h;
        if (b < bars) it.filled_rectangle(bx, by, 4, bar_h, COLOR_GREEN);
        else it.filled_rectangle(bx, by, 4, bar_h, COLOR_MID_GRAY);
      }

      // GESTION EXHAUSTIVE DES ÉTATS ALARME
      Color banner_bg = COLOR_PANEL_BG, banner_text = COLOR_WHITE;
      const char* state_title = "ETAT INCONNU";
      const char* state_sub = alarm_st.c_str();

      if (!ha_ok) {
        state_title = "HA DECONNECTE"; state_sub = "Liaison perdue";
      }
      else if (alarm_st == "disarmed") {
        banner_bg = COLOR_GREEN_DIM; banner_text = COLOR_GREEN; state_title = "SECURISE"; state_sub = "Alarme desactivee";
      }
      else if (alarm_st == "armed_away") {
        banner_bg = COLOR_RED_DIM; banner_text = COLOR_RED; state_title = "ARME TOTAL"; state_sub = "Surveillance active (Mode Absent)";
      }
      else if (alarm_st == "armed_night" || alarm_st == "armed_home") {
        banner_bg = COLOR_ORANGE_DIM; banner_text = COLOR_ORANGE; state_title = "ARME PARTIEL"; state_sub = "Perimetre protege";
      }
      else if (alarm_st == "armed_vacation" || alarm_st == "armed_custom_bypass") {
        banner_bg = COLOR_ORANGE_DIM; banner_text = COLOR_ORANGE; state_title = "ARME (SPECIAL)"; state_sub = "Capteurs isoles";
      }
      else if (alarm_st == "arming") {
        banner_bg = COLOR_ORANGE_DIM; banner_text = COLOR_ORANGE; state_title = "ARMEMENT..."; state_sub = "Quittez les lieux";
      }
      else if (alarm_st == "disarming") {
        banner_bg = COLOR_ORANGE_DIM; banner_text = COLOR_ORANGE; state_title = "DESARMEMENT..."; state_sub = "Traitement en cours";
      }
      else if (alarm_st == "pending") {
        banner_bg = COLOR_ORANGE_DIM; banner_text = COLOR_ORANGE; state_title = "COMPTE A REBOURS"; state_sub = "Desarmez le systeme";
      }
      else if (alarm_st == "triggered") {
        banner_bg = COLOR_RED_DIM; banner_text = COLOR_RED; state_title = "ALERTE INTRUSION !"; state_sub = "Declenchement en cours";
      }

      // Mini badge état alarme dans le header quand on est sur Maison, Tado, Trains ou Arrosage
      if (current_p != 6) {
        draw_rrect(330, 10, 140, 28, 14, banner_bg);
        it.printf(400, 24, id(font_16), banner_text, TextAlign::CENTER, "%s", state_title);
      }

      auto format_time_str = [](const std::string& raw) -> std::string {
        if (raw.empty() || raw == "unavailable" || raw == "unknown") return "--:--";
        auto pos_t = raw.find('T');
        if (pos_t == std::string::npos) pos_t = raw.find(' ');
        if (pos_t != std::string::npos && raw.length() >= pos_t + 6) {
          return raw.substr(pos_t + 1, 5);
        }
        if (raw.length() == 5 && raw[2] == ':') return raw;
        if (raw.length() > 5) return raw.substr(0, 5);
        return raw;
      };

      // Dessin vectoriel icône météo doublée en taille (soleil, éclaircies, nuages, pluie)
      auto draw_weather_icon = [&](int icx, int icy, const std::string& cond, float cloud_pct, float rain_pct) {
        std::string c_lower = cond;
        std::transform(c_lower.begin(), c_lower.end(), c_lower.begin(), ::tolower);
        bool is_rain = (!std::isnan(rain_pct) && rain_pct >= 40.0f) || c_lower.find("pluie") != std::string::npos || c_lower.find("rain") != std::string::npos;
        bool is_cloud = (!std::isnan(cloud_pct) && cloud_pct >= 25.0f) || c_lower.find("nuag") != std::string::npos || c_lower.find("cloud") != std::string::npos || c_lower.find("eclair") != std::string::npos;
        bool is_sun = (!is_cloud && !is_rain) || (cloud_pct <= 70.0f && c_lower.find("partly") != std::string::npos) || c_lower.find("eclair") != std::string::npos || c_lower.find("sun") != std::string::npos || c_lower.find("clair") != std::string::npos;

        if (is_sun && !is_cloud && !is_rain) {
          // Soleil pur (doublé)
          it.filled_circle(icx, icy, 26, Color(255, 204, 0));
          for (int deg = 0; deg < 360; deg += 45) {
            float rad = deg * 3.14159f / 180.0f;
            int x1 = icx + (int)(cosf(rad) * 32);
            int y1 = icy + (int)(sinf(rad) * 32);
            int x2 = icx + (int)(cosf(rad) * 44);
            int y2 = icy + (int)(sinf(rad) * 44);
            it.line(x1, y1, x2, y2, Color(255, 204, 0));
            it.line(x1 + 1, y1, x2 + 1, y2, Color(255, 204, 0));
            it.line(x1, y1 + 1, x2, y2 + 1, Color(255, 204, 0));
          }
        } else if (is_sun && is_cloud) {
          // Éclaircies (Soleil derrière nuage doublé)
          it.filled_circle(icx + 22, icy - 14, 22, Color(255, 204, 0));
          it.line(icx + 44, icy - 14, icx + 55, icy - 14, Color(255, 204, 0));
          it.line(icx + 44, icy - 13, icx + 55, icy - 13, Color(255, 204, 0));
          it.line(icx + 22, icy - 36, icx + 22, icy - 47, Color(255, 204, 0));
          it.line(icx + 23, icy - 36, icx + 23, icy - 47, Color(255, 204, 0));
          it.line(icx + 38, icy - 30, icx + 46, icy - 38, Color(255, 204, 0));
          it.line(icx + 39, icy - 30, icx + 47, icy - 38, Color(255, 204, 0));
          it.filled_circle(icx - 18, icy + 10, 20, Color(190, 205, 225));
          it.filled_circle(icx + 6, icy + 2, 26, Color(215, 228, 242));
          it.filled_circle(icx + 28, icy + 12, 18, Color(190, 205, 225));
          it.filled_rectangle(icx - 18, icy + 10, 48, 20, Color(190, 205, 225));
        } else if (is_cloud && !is_rain) {
          // Nuageux (doublé)
          it.filled_circle(icx + 16, icy - 4, 22, Color(120, 135, 155));
          it.filled_circle(icx - 12, icy - 8, 20, Color(120, 135, 155));
          it.filled_circle(icx - 22, icy + 10, 22, Color(180, 195, 210));
          it.filled_circle(icx + 4, icy + 4, 28, Color(205, 218, 230));
          it.filled_circle(icx + 30, icy + 12, 18, Color(180, 195, 210));
          it.filled_rectangle(icx - 22, icy + 10, 52, 22, Color(180, 195, 210));
        } else {
          // Pluvieux (doublé avec gouttes)
          it.filled_circle(icx - 18, icy - 2, 20, Color(140, 155, 175));
          it.filled_circle(icx + 6, icy - 8, 26, Color(160, 175, 195));
          it.filled_circle(icx + 28, icy + 2, 18, Color(140, 155, 175));
          it.filled_rectangle(icx - 18, icy - 2, 48, 20, Color(140, 155, 175));
          it.line(icx - 16, icy + 22, icx - 22, icy + 38, COLOR_CYAN);
          it.line(icx - 15, icy + 22, icx - 21, icy + 38, COLOR_CYAN);
          it.line(icx + 2, icy + 22, icx - 4, icy + 38, COLOR_CYAN);
          it.line(icx + 3, icy + 22, icx - 3, icy + 38, COLOR_CYAN);
          it.line(icx + 20, icy + 22, icx + 14, icy + 38, COLOR_CYAN);
          it.line(icx + 21, icy + 22, icx + 15, icy + 38, COLOR_CYAN);
        }
      };

      // =============================================================
      // PAGE 0 : MAISON (COMMANDES RAPIDES, HEURE, MÉTÉO & TRAINS)
      // =============================================================
      if (current_p == 0) {
        // --- 1. LIGNE SUPÉRIEURE : 3 COMMANDES RAPIDES (y: 56 à 184) ---
        // A. CARTE PORTAIL (4 ÉTATS : FERMÉ, EN OUVERTURE, OUVERT, EN FERMETURE)
        {
          int cx = 24, cy = 56, cw = 240, ch = 126;
          draw_rrect(cx, cy, cw, ch, 14, COLOR_PANEL_BG);

          bool portail_known = id(ha_portail_state).has_state();
          bool portail_open  = portail_known && id(ha_portail_state).state;
          int g_act = id(gate_action_state);

          Color col_p, col_p_dim;
          const char* p_status_str = "FERMÉ";

          if (g_act == 1) {
            col_p = COLOR_ORANGE; col_p_dim = COLOR_ORANGE_DIM; p_status_str = "EN OUVERTURE";
          } else if (g_act == 2) {
            col_p = COLOR_ORANGE; col_p_dim = COLOR_ORANGE_DIM; p_status_str = "EN FERMETURE";
          } else {
            if (!portail_known) {
              col_p = COLOR_DARK_GRAY; col_p_dim = COLOR_MID_GRAY; p_status_str = "INCONNU";
            } else if (portail_open) {
              col_p = COLOR_RED; col_p_dim = COLOR_RED_DIM; p_status_str = "OUVERT";
            } else {
              col_p = COLOR_GREEN; col_p_dim = COLOR_GREEN_DIM; p_status_str = "FERMÉ";
            }
          }

          draw_rrect(cx + 14, cy + 12, 4, 20, 2, col_p);
          it.printf(cx + 26, cy + 22, id(font_20), COLOR_WHITE, TextAlign::CENTER_LEFT, "PORTAIL");

          // Badge statut centré verticalement (ligne d'action textuelle retirée)
          draw_rrect(cx + 18, cy + 50, cw - 36, 52, 12, col_p_dim);
          it.printf(cx + cw / 2, cy + 76, (g_act != 0) ? id(font_20) : id(font_24), col_p, TextAlign::CENTER, "%s", p_status_str);
        }

        // B. CARTE LUMIÈRES EXTÉRIEURES (VERT = ÉTEINTES, ROUGE = ALLUMÉES)
        {
          int cx = 280, cy = 56, cw = 240, ch = 126;
          draw_rrect(cx, cy, cw, ch, 14, COLOR_PANEL_BG);

          bool lum_known = id(ha_lumieres_ext).has_state();
          bool lum_on    = lum_known && id(ha_lumieres_ext).state;

          Color col_l, col_l_dim;
          const char* lum_text = "INCONNU";
          if (!lum_known) {
            col_l = COLOR_DARK_GRAY; col_l_dim = COLOR_MID_GRAY; lum_text = "INCONNU";
          } else if (lum_on) {
            col_l = COLOR_RED; col_l_dim = COLOR_RED_DIM; lum_text = "ALLUMÉES";
          } else {
            col_l = COLOR_GREEN; col_l_dim = COLOR_GREEN_DIM; lum_text = "ÉTEINTES";
          }

          draw_rrect(cx + 14, cy + 12, 4, 20, 2, col_l);
          it.printf(cx + 26, cy + 22, id(font_20), COLOR_WHITE, TextAlign::CENTER_LEFT, "LUMIÈRES EXT.");

          // Badge statut centré verticalement (ligne d'action textuelle retirée)
          draw_rrect(cx + 18, cy + 50, cw - 36, 52, 12, col_l_dim);
          it.printf(cx + cw / 2, cy + 76, id(font_24), col_l, TextAlign::CENTER, "%s", lum_text);
        }

        // C. CARTE HEURE (REMPLACE LA TUILE ARROSAGE)
        {
          int cx = 536, cy = 56, cw = 240, ch = 126;
          draw_rrect(cx, cy, cw, ch, 14, COLOR_PANEL_BG);

          // Grand affichage de l'heure (taille doublée 64, ligne HEURE retirée)
          it.printf(cx + cw / 2, cy + 48, id(font_64), COLOR_WHITE, TextAlign::CENTER, "%s", time_str);

          // Date formatée en français
          const char* jours[] = {"", "Dimanche", "Lundi", "Mardi", "Mercredi", "Jeudi", "Vendredi", "Samedi"};
          const char* mois[]  = {"", "Jan.", "Fév.", "Mars", "Avr.", "Mai", "Juin", "Juil.", "Août", "Sept.", "Oct.", "Nov.", "Déc."};
          char date_str[64] = "";
          if (now.is_valid()) {
            int dow = now.day_of_week;
            int m = now.month;
            if (dow >= 1 && dow <= 7 && m >= 1 && m <= 12) {
              snprintf(date_str, sizeof(date_str), "%s %d %s", jours[dow], now.day_of_month, mois[m]);
            } else {
              now.strftime(date_str, sizeof(date_str), "%d/%m/%Y");
            }
          }
          it.printf(cx + cw / 2, cy + 102, id(font_16), COLOR_LIGHT_GRAY, TextAlign::CENTER, "%s", date_str);
        }

        // --- 2. LIGNE INFÉRIEURE : 2 CARTES INFO (y: 196 à 414) ---
        // A. MÉTÉO ENGHIEN (AVEC ICÔNE COUVERTURE NUAGEUSE & POURCENTAGE)
        {
          int cx = 24, cy = 196, cw = 366, ch = 218;
          draw_rrect(cx, cy, cw, ch, 14, COLOR_PANEL_BG);
          draw_rrect(cx + 14, cy + 12, 4, 22, 2, COLOR_CYAN);
          it.printf(cx + 26, cy + 23, id(font_20), COLOR_WHITE, TextAlign::CENTER_LEFT, "MÉTÉO ENGHIEN");
          it.line(cx + 14, cy + 46, cx + cw - 14, cy + 46, COLOR_CARD_BORDER);

          float t_val = id(ha_meteo_temp).state;
          char t_buf[24] = "--.- °C";
          Color t_col = COLOR_CYAN;
          if (!std::isnan(t_val)) {
            snprintf(t_buf, sizeof(t_buf), "%.1f °C", t_val);
            if (t_val <= 19.0f) t_col = COLOR_CYAN;
            else if (t_val <= 25.0f) t_col = COLOR_GREEN;
            else if (t_val < 30.0f) t_col = COLOR_ORANGE;
            else t_col = COLOR_RED;
          }
          it.printf(cx + 24, cy + 82, id(font_32), t_col, TextAlign::CENTER_LEFT, "%s", t_buf);

          float cloud_val = id(ha_meteo_cloud).state;
          float rain_val  = id(ha_meteo_rain).state;
          std::string cond_str = id(ha_meteo_condition).state;
          if (cond_str.empty() || cond_str == "unavailable" || cond_str == "unknown") {
            if (!std::isnan(cloud_val)) {
              if (cloud_val < 20.0f) cond_str = "Ensoleillé";
              else if (cloud_val <= 65.0f) cond_str = "Éclaircies";
              else cond_str = "Couvert";
            } else cond_str = "Météo";
          }
          it.printf(cx + 24, cy + 122, id(font_20), COLOR_LIGHT_GRAY, TextAlign::CENTER_LEFT, "%s", cond_str.c_str());

          // Dessin de l'icône météo vectorielle agrandie représentant la couverture nuageuse
          draw_weather_icon(cx + 290, cy + 94, cond_str, cloud_val, rain_val);

          // Badge couverture nuageuse en %
          char cloud_buf[32] = "Nuages : -- %";
          if (!std::isnan(cloud_val)) snprintf(cloud_buf, sizeof(cloud_buf), "Nuages : %.0f %%", cloud_val);
          draw_rrect(cx + 235, cy + 146, 118, 26, 6, COLOR_MID_GRAY);
          it.printf(cx + 294, cy + 159, id(font_16), COLOR_WHITE, TextAlign::CENTER, "%s", cloud_buf);

          // Précipitations et Gel
          char r_buf[32] = "Précipitations : -- %";
          if (!std::isnan(rain_val)) snprintf(r_buf, sizeof(r_buf), "Précipitations : %.0f %%", rain_val);
          it.printf(cx + 24, cy + 158, id(font_16), COLOR_LIGHT_GRAY, TextAlign::CENTER_LEFT, "%s", r_buf);

          float frz_val = id(ha_meteo_freeze).state;
          char f_buf[32] = "Risque Gel : 0 %";
          if (!std::isnan(frz_val) && frz_val > 0.0f) snprintf(f_buf, sizeof(f_buf), "Risque Gel : %.0f %%", frz_val);
          it.printf(cx + 24, cy + 188, id(font_16), (frz_val > 0.0f) ? COLOR_BLUE : COLOR_DARK_GRAY, TextAlign::CENTER_LEFT, "%s", f_buf);
        }

        // B. PROCHAINS DÉPARTS PARIS & EAUBONNE (2 COLONNES SYMÉTRIQUES)
        {
          int cx = 410, cy = 196, cw = 366, ch = 218;
          draw_rrect(cx, cy, cw, ch, 14, COLOR_PANEL_BG);

          // Séparateur vertical entre PARIS et EAUBONNE
          it.line(cx + 183, cy + 12, cx + 183, cy + ch - 12, COLOR_CARD_BORDER);

          // ----------------- COLONNE 1 : PARIS -----------------
          draw_rrect(cx + 12, cy + 12, 4, 22, 2, COLOR_BLUE);
          it.printf(cx + 22, cy + 23, id(font_20), COLOR_WHITE, TextAlign::CENTER_LEFT, "PARIS");
          it.line(cx + 12, cy + 46, cx + 175, cy + 46, COLOR_CARD_BORDER);

          // Paris Train 1
          std::string p1_time = format_time_str(id(ha_train_p1_time).state);
          it.printf(cx + 16, cy + 68, id(font_24), COLOR_WHITE, TextAlign::CENTER_LEFT, "%s", p1_time.c_str());

          int mp1 = (int)id(ha_train_p1_min).state;
          char cdp1_buf[20] = "-- min";
          Color cdp1_bg = COLOR_MID_GRAY, cdp1_fg = COLOR_LIGHT_GRAY;
          if (mp1 != -999 && p1_time != "--:--") {
            if (mp1 < 0) { snprintf(cdp1_buf, sizeof(cdp1_buf), "Parti"); cdp1_bg = COLOR_MID_GRAY; cdp1_fg = COLOR_DARK_GRAY; }
            else if (mp1 <= 1) { snprintf(cdp1_buf, sizeof(cdp1_buf), "A QUAI"); cdp1_bg = COLOR_RED_DIM; cdp1_fg = COLOR_RED; }
            else if (mp1 <= 3) { snprintf(cdp1_buf, sizeof(cdp1_buf), "IMMIN."); cdp1_bg = COLOR_RED_DIM; cdp1_fg = COLOR_RED; }
            else if (mp1 <= 7) { snprintf(cdp1_buf, sizeof(cdp1_buf), "%d min", mp1); cdp1_bg = COLOR_ORANGE_DIM; cdp1_fg = COLOR_ORANGE; }
            else { snprintf(cdp1_buf, sizeof(cdp1_buf), "%d min", mp1); cdp1_bg = COLOR_GREEN_DIM; cdp1_fg = COLOR_GREEN; }
          }
          draw_rrect(cx + 96, cy + 56, 74, 22, 6, cdp1_bg);
          it.printf(cx + 133, cy + 67, id(font_16), cdp1_fg, TextAlign::CENTER, "%s", cdp1_buf);

          // Voie sous les minutes + Mission
          std::string trk_p1 = id(ha_train_p1_track).state;
          char trk_p1_buf[16] = "V.-";
          if (!trk_p1.empty() && trk_p1 != "unavailable" && trk_p1 != "unknown") snprintf(trk_p1_buf, sizeof(trk_p1_buf), "V.%s", trk_p1.c_str());
          it.printf(cx + 16, cy + 96, id(font_16), COLOR_CYAN, TextAlign::CENTER_LEFT, "%s", trk_p1_buf);

          std::string msn_p1 = id(ha_train_p1_mission).state;
          if (msn_p1.empty() || msn_p1 == "unavailable" || msn_p1 == "unknown" || msn_p1 == "-") msn_p1 = "Ligne H";
          it.printf(cx + 60, cy + 96, id(font_16), COLOR_DARK_GRAY, TextAlign::CENTER_LEFT, "%s", msn_p1.c_str());

          it.line(cx + 12, cy + 120, cx + 175, cy + 120, COLOR_CARD_BORDER);

          // Paris Train 2
          std::string p2_time = format_time_str(id(ha_train_p2_time).state);
